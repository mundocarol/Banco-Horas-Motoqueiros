function toast(msg, tipo = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + tipo;
  setTimeout(() => el.className = 'toast', 4000);
}

function parseNum(v) {
  if (v === '' || v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  return parseFloat(String(v).replace(/\s/g, '').replace(',', '.')) || 0;
}

function formataMoeda(v) {
  const sinal = v < 0 ? '-' : '';
  return sinal + 'R$ ' + Math.abs(v).toFixed(2).replace('.', ',');
}

function fmtKM(v) { return parseNum(v).toFixed(1).replace('.', ','); }

function hojeStr() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

function ordenarPorDataDesc(lista, campoData) {
  return lista.slice().sort((a, b) => {
    const dataA = (a[campoData] || '').split('/').reverse().join('');
    const dataB = (b[campoData] || '').split('/').reverse().join('');
    const cmp = dataB.localeCompare(dataA);
    if (cmp !== 0) return cmp;
    return (b._row || 0) - (a._row || 0);
  });
}

function getMesesOptions(selecionado) {
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return meses.map((m,i) => {
    const val = String(i+1).padStart(2,'0');
    return `<option value="${val}" ${val === selecionado ? 'selected' : ''}>${m}</option>`;
  }).join('');
}

function getAnosOptions(selecionado) {
  const now = new Date();
  let out = '';
  for (let y = now.getFullYear() - 3; y <= now.getFullYear() + 1; y++) {
    out += `<option value="${y}" ${String(y) === String(selecionado) ? 'selected' : ''}>${y}</option>`;
  }
  return out;
}

function nomeMes(mes) {
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return meses[parseInt(mes) - 1] || mes;
}

function mesPadrao() {
  const d = new Date();
  const mesAtual = d.getMonth() + 1;
  const anoAtual = d.getFullYear();
  if (mesAtual === 1) return { mes: '12', ano: String(anoAtual - 1) };
  return { mes: String(mesAtual - 1).padStart(2,'0'), ano: String(anoAtual) };
}

/* ============================================================
   API
   ============================================================ */
async function lerAba(nome) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${nome}!A2:Z?key=${API_KEY}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return (await resp.json()).values || [];
}

async function api(action, payload = {}) {
  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload })
    });
    if (!resp.ok) {
      return { ok: false, error: 'HTTP ' + resp.status };
    }
    const data = await resp.json();
    return data;
  } catch (e) {
    console.error('Erro na API:', e);
    return { ok: false, error: 'Falha de conexão: ' + e.message };
  }
}

/* ============================================================
   CARREGAR MOTOQUEIROS
   ============================================================ */
async function carregarMotoqueiros() {
  const linhas = await lerAba('Cadastro');
  motoqueiros = linhas.map((r, i) => ({
    id: (r[0]||'').toString().trim().toLowerCase(),
    nome: (r[1]||'').toString().trim(),
    tipo: (r[2]||'').toString().trim().toLowerCase(),
    status: (r[4]||'').toString().trim().toLowerCase(),
    observacao: (r[7]||'').toString().trim(),
    _row: i + 2
  }))
  .filter(m => m.tipo === 'motoqueiro' && m.status === 'ativo')
  .sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
}

async function carregarMotos() {
  const linhas = await lerAba('Motos');
  todasMotos = linhas.map((r, i) => ({
    _row:          i + 2,
    motoboyId:     (r[0]||'').toString().trim().toLowerCase(),
    motoboyNome:   (r[1]||'').toString().trim(),
    data:          (r[2]||'').toString().trim(),
    km:            parseNum(r[3]),
    entregas:      parseNum(r[4]),
    dataReposicao: (r[5]||'').toString().trim(),
    tipoPagamento: (r[6]||'').toString().trim(),
    valor:         parseNum(r[7]),
    nf:            (r[8]||'').toString().trim(),
    local:         (r[9]||'').toString().trim()
  }));
}

function filtrarPorMotoboy(motoId) {
  if (motoId === 'TODOS') return todasMotos;
  return todasMotos.filter(m => m.motoboyId === motoId);
}

function dividirCorridasPagamentos(linhas) {
  const corridas   = linhas.filter(r => r.data && (r.km > 0 || r.entregas > 0) && !r.dataReposicao);
  const pagamentos = linhas.filter(r => r.dataReposicao || r.tipoPagamento || r.valor > 0);
  return { corridas, pagamentos };
}

function calcularSaldos({ corridas, pagamentos }) {
  const totalKM = corridas.reduce((s, c) => s + c.km, 0);

  const baseGas = totalKM * REGRAS.VALOR_POR_KM;
  const repGas = pagamentos
    .filter(p => p.tipoPagamento.toLowerCase() === 'gasolina')
    .reduce((s, p) => s + p.valor, 0);
  const saldoGas = baseGas - repGas;

  const baseOleo = (totalKM / REGRAS.KM_POR_BONUS_OLEO) * REGRAS.BONUS_OLEO;
  const repOleo = pagamentos
    .filter(p => {
      const t = p.tipoPagamento.toLowerCase();
      return t === 'óleo' || t === 'oleo';
    })
    .reduce((s, p) => s + p.valor, 0);
  const saldoOleo = baseOleo - repOleo;

  const basePneu = (totalKM / REGRAS.KM_POR_BONUS_PNEU) * REGRAS.BONUS_PNEU;
  const repPneu = pagamentos
    .filter(p => p.tipoPagamento.toLowerCase() === 'pneu')
    .reduce((s, p) => s + p.valor, 0);
  const saldoPneu = basePneu - repPneu;

  return { saldoGas, saldoOleo, saldoPneu };
}

async function salvarPagamento() {
  const m = motoqueiros.find(x => x.id === motoAtual);
  if (!m) return toast('Selecione um motoqueiro', 'err');

  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  const payload = {
    motoboyId: motoAtual,
    motoboyNome: m.nome,
    dataReposicao: document.getElementById('p-data').value.trim(),
    tipoPagamento: document.getElementById('p-tipo').value,
    valor: document.getElementById('p-valor').value.trim().replace(',', '.'),
    nf: document.getElementById('p-nf').value.trim(),
    local: document.getElementById('p-local').value.trim()
  };

  if (!payload.dataReposicao) {
    btn.disabled = false;
    btn.textContent = '💾 Salvar Reposição';
    return toast('Informe a data', 'err');
  }

  const r = await api('addPagamento', payload);
  if (r.ok) {
    toast('✅ Reposição salva!');
    fecharModal();
    await recarregar();
  } else {
    toast('❌ ' + (r.error || 'Erro'), 'err');
    btn.disabled = false;
    btn.textContent = '💾 Salvar Reposição';
  }
}

function calcularRecibo(mes, ano, faltas, aluguel, desloc) {
  const mesAno = mes + '/' + ano;

  // Filtra reposições do motoqueiro no mês/ano escolhido
  const linhas = todasMotos.filter(x => x.motoboyId === motoAtual);
  const pagamentosMes = linhas.filter(p => {
    if (!p.dataReposicao) return false;
    // dataReposicao no formato dd/mm/aaaa
    const partes = p.dataReposicao.split('/');
    if (partes.length !== 3) return false;
    return partes[1] === mes && partes[2] === ano;
  });

  const gas = pagamentosMes
    .filter(p => p.tipoPagamento.toLowerCase() === 'gasolina')
    .reduce((s, p) => s + p.valor, 0);
  const oleo = pagamentosMes
    .filter(p => {
      const t = p.tipoPagamento.toLowerCase();
      return t === 'óleo' || t === 'oleo';
    })
    .reduce((s, p) => s + p.valor, 0);
  const pneu = pagamentosMes
    .filter(p => p.tipoPagamento.toLowerCase() === 'pneu')
    .reduce((s, p) => s + p.valor, 0);

  const totalReposicoes = gas + oleo + pneu;

  // Cálculo de faltas sobre aluguel e deslocamento (mês = 30 dias)
  const diariaAluguel = aluguel / 30;
  const diariaDesloc  = desloc / 30;
  const descontoAluguel = diariaAluguel * faltas;
  const descontoDesloc  = diariaDesloc * faltas;

  const aluguelLiquido = aluguel - descontoAluguel;
  const deslocLiquido  = desloc - descontoDesloc;

  const totalGeral = totalReposicoes + aluguelLiquido + deslocLiquido;

  return {
    gas, oleo, pneu,
    totalReposicoes,
    diariaAluguel, diariaDesloc,
    descontoAluguel, descontoDesloc,
    aluguelLiquido, deslocLiquido,
    totalGeral
  };
}

/* ============================================================
   RECIBO — IMPRESSÃO
   ============================================================ */
function imprimirRecibo() {
  const m = motoqueiros.find(x => x.id === motoAtual);
  if (!m) return;

  const calc = calcularRecibo(
    reciboState.mes,
    reciboState.ano,
    reciboState.faltas,
    reciboState.aluguel,
    reciboState.deslocamento
  );

  const periodoTexto = nomeMes(reciboState.mes) + ' de ' + reciboState.ano;

  // Monta lista de reposições detalhadas para a tabela
  const linhas = todasMotos.filter(x => x.motoboyId === motoAtual);
  const pagamentosMes = linhas.filter(p => {
    if (!p.dataReposicao) return false;
    const partes = p.dataReposicao.split('/');
    if (partes.length !== 3) return false;
    return partes[1] === reciboState.mes && partes[2] === reciboState.ano;
  });

  const linhasTabela = [];
  linhasTabela.push(`
    <tr>
      <td>Reposição de Combustível (Gasolina)</td>
      <td style="text-align:right">${formataMoeda(calc.gas)}</td>
    </tr>
  `);
  linhasTabela.push(`
    <tr>
      <td>Reposição de Óleo</td>
      <td style="text-align:right">${formataMoeda(calc.oleo)}</td>
    </tr>
  `);
  linhasTabela.push(`
    <tr>
      <td>Reposição de Pneu</td>
      <td style="text-align:right">${formataMoeda(calc.pneu)}</td>
    </tr>
  `);
  linhasTabela.push(`
    <tr class="rp-subtotal">
      <td>Total de Reposições (Gasolina + Óleo + Pneu)</td>
      <td style="text-align:right">${formataMoeda(calc.totalReposicoes)}</td>
    </tr>
  `);
  linhasTabela.push(`
    <tr>
      <td>Aluguel da Moto (30 dias)</td>
      <td style="text-align:right">${formataMoeda(reciboState.aluguel)}</td>
    </tr>
  `);
  if (reciboState.faltas > 0) {
    linhasTabela.push(`
      <tr>
        <td style="padding-left:28px">
          Desconto por ${reciboState.faltas} falta(s) — diária ${formataMoeda(calc.diariaAluguel)}
        </td>
        <td style="text-align:right; color:#b91c1c">− ${formataMoeda(calc.descontoAluguel)}</td>
      </tr>
    `);
  }
  linhasTabela.push(`
    <tr class="rp-subtotal">
      <td>Aluguel Líquido</td>
      <td style="text-align:right">${formataMoeda(calc.aluguelLiquido)}</td>
    </tr>
  `);
  linhasTabela.push(`
    <tr>
      <td>Ajuda de Custo — Deslocamento (30 dias)</td>
      <td style="text-align:right">${formataMoeda(reciboState.deslocamento)}</td>
    </tr>
  `);
  if (reciboState.faltas > 0) {
    linhasTabela.push(`
      <tr>
        <td style="padding-left:28px">
          Desconto por ${reciboState.faltas} falta(s) — diária ${formataMoeda(calc.diariaDesloc)}
        </td>
        <td style="text-align:right; color:#b91c1c">− ${formataMoeda(calc.descontoDesloc)}</td>
      </tr>
    `);
  }
  linhasTabela.push(`
    <tr class="rp-subtotal">
      <td>Deslocamento Líquido</td>
      <td style="text-align:right">${formataMoeda(calc.deslocLiquido)}</td>
    </tr>
  `);
  linhasTabela.push(`
    <tr class="rp-total-row">
      <td>TOTAL GERAL</td>
      <td style="text-align:right">${formataMoeda(calc.totalGeral)}</td>
    </tr>
  `);

  const html = `
    <div class="recibo-print">
      <div class="rp-header">
        <h1>${EMPRESA.NOME.toUpperCase()}</h1>
        <div class="cnpj">CNPJ: ${EMPRESA.CNPJ}</div>
      </div>

      <div class="rp-title">Recibo de Pagamento</div>

      <div class="rp-subtitle">
        <b>Motoqueiro(a):</b> ${m.nome}
      </div>

      <div class="rp-corpo">
        Declaro ter recebido de <b>${EMPRESA.NOME}</b>, CNPJ <b>${EMPRESA.CNPJ}</b>, a quantia
        de <b>${formataMoeda(calc.totalReposicoes)}</b> a título de <b>reposição de combustível,
        óleo e/ou pneu</b>, mediante apresentação de recibos ou de solicitação de baixa do saldo
        acumulado, e também a quantia de <b>${formataMoeda(calc.aluguelLiquido)}</b> referente ao
        <b>aluguel da moto</b> e <b>${formataMoeda(calc.deslocLiquido)}</b> de <b>ajuda de custo
        para deslocamento</b>, totalizando <b>${formataMoeda(calc.totalGeral)}</b>.
      </div>

      <table class="rp-tabela">
        <thead>
          <tr>
            <th>Descrição</th>
            <th style="text-align:right; width:180px">Valor (R$)</th>
          </tr>
        </thead>
        <tbody>
          ${linhasTabela.join('')}
        </tbody>
      </table>

      <div class="rp-periodo">
        Valores referentes ao mês de ${periodoTexto}
      </div>

      <div class="rp-obs">
        <div class="rp-obs-title">Observações Importantes</div>
        Os valores excedentes de gasolina além do gasto efetivo para as entregas, a troca de óleo,
        a troca de pneus e a ajuda de custo para deslocamento (destinada ao motoqueiro para buscar
        itens próximos à loja) são <b>benefícios não obrigatórios</b> oferecidos pela empresa, que
        <b>não compõem o salário</b> e podem, portanto, ser revogados a qualquer momento, sempre
        seguindo a razoabilidade de uma prévia comunicação. O <b>aluguel da moto</b> acordado entre
        as partes no ingresso do serviço segue também como valor que <b>não compõe a remuneração
        salarial</b>.
      </div>

      <div class="rp-declaracao">
        E por ser expressão da verdade, firmo o presente recibo para todos os fins de direito.
      </div>

      <div class="rp-assinatura">
        <div class="linha"></div>
        <div class="nome">${m.nome}</div>
        <div class="cargo">Motoboy — CPF: ______________________</div>
      </div>

      <div class="rp-rodape">
        ${EMPRESA.NOME} · CNPJ ${EMPRESA.CNPJ}<br>
        Recibo gerado em ${new Date().toLocaleString('pt-BR')}
      </div>
    </div>
  `;

  const printArea = document.getElementById('print-area');
  printArea.innerHTML = html;

  // Espera 1 tick pra render, aí imprime
  setTimeout(() => {
    window.print();
  }, 100);
}

/* ============================================================
   RECARREGAR
   ============================================================ */
async function recarregar() {
  const loading = document.getElementById('loading');
  loading.classList.add('show');
  try {
    await Promise.all([carregarMotoqueiros(), carregarMotos()]);

    if (motoAtual && motoAtual !== 'TODOS') {
      if (!motoqueiros.find(m => m.id === motoAtual)) {
        motoAtual = motoqueiros[0]?.id || 'TODOS';
      }
    }
    if (!motoAtual) {
      motoAtual = motoqueiros[0]?.id || 'TODOS';
    }

    document.getElementById('btn-recibo').disabled = (motoAtual === 'TODOS');

    renderSeletor();
    renderizar();
  } catch(e) {
    toast('Erro: ' + e.message, 'err');
  } finally {
    loading.classList.remove('show');
  }
}

/* ============================================================
   LOGOUT / INICIALIZA
   ============================================================ */
function logout() { sessionStorage.clear(); location.href = 'index.html'; }

recarregar();
