<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Horas - Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #eef1f5;
    color: #1e293b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ============================================
     TOPBAR
     ============================================ */
  .topbar {
    background: #0f172a; color: white;
    padding: 14px 32px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(15,23,42,0.12);
    flex-wrap: wrap; gap: 12px;
  }
  .topbar h1 {
    font-size: 16px; font-weight: 700;
    letter-spacing: -0.2px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar h1 .dot {
    display: inline-block; width: 8px; height: 8px;
    background: #3b82f6; border-radius: 50%;
  }
  .topbar h1 span { color: #93c5fd; font-weight: 500; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .nav-btn {
    background: rgba(255,255,255,0.06); color: #cbd5e1;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.18s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.12); color: white; }
  .logout-btn {
    background: transparent; color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.18s;
  }
  .logout-btn:hover { background: rgba(239,68,68,0.12); color: #fca5a5; border-color: rgba(239,68,68,0.2); }

  /* ============================================
     TABS
     ============================================ */
  .tabs-wrap {
    background: white;
    border-bottom: 1px solid #dbe1ea;
    position: sticky; top: 60px; z-index: 99;
  }
  .tabs {
    max-width: 1400px; margin: 0 auto;
    padding: 0 32px;
    display: flex; gap: 4px; overflow-x: auto;
  }
  .tab {
    padding: 16px 20px; cursor: pointer;
    font-weight: 500; font-size: 14px; color: #64748b;
    border: none; background: none;
    border-bottom: 2px solid transparent;
    transition: all 0.18s; white-space: nowrap;
    font-family: inherit;
    display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: #0f172a; }
  .tab.active { color: #1d4ed8; border-bottom-color: #1d4ed8; font-weight: 600; }

  /* ============================================
     CONTEÚDO
     ============================================ */
  .content { max-width: 1400px; margin: 0 auto; padding: 28px 32px; }
  .pane { display: none; }
  .pane.active { display: block; }

  /* Filtro + ações */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; gap: 16px; flex-wrap: wrap;
  }
  .search-box {
    position: relative; flex: 1; max-width: 420px;
  }
  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border: 1px solid #d1d9e3;
    background: white;
    border-radius: 10px;
    font-size: 14px; font-family: inherit;
    color: #0f172a;
    transition: all 0.18s;
  }
  .search-box input:focus {
    outline: none; border-color: #1d4ed8;
    box-shadow: 0 0 0 3px rgba(29,78,216,0.1);
  }
  .search-box::before {
    content: '';
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3ccircle cx='11' cy='11' r='8'%3e%3c/circle%3e%3cpath d='m21 21-4.35-4.35'%3e%3c/path%3e%3c/svg%3e");
    background-size: cover;
    opacity: 0.6;
  }

  /* ============================================
     CARD FUNCIONÁRIO - NOVO DESIGN
     ============================================ */
  .emp-card {
    background: white;
    padding: 22px 24px;
    border-radius: 14px;
    border: 1px solid #e3e8ef;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
    margin-bottom: 14px;
    transition: all 0.2s ease;
  }
  .emp-card:hover {
    box-shadow: 0 4px 16px rgba(15,23,42,0.06);
    border-color: #cbd5e1;
  }

  .emp-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; flex-wrap: wrap;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f1f5f9;
  }
  .emp-info { flex: 1; min-width: 200px; }
  .emp-nome {
    font-size: 17px; font-weight: 700; color: #0f172a;
    letter-spacing: -0.2px; margin-bottom: 4px;
  }
  .emp-meta {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: #64748b;
  }
  .emp-meta span { display: flex; align-items: center; gap: 5px; }

  .emp-badges {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .badge {
    padding: 6px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    letter-spacing: -0.1px;
  }
  .badge small {
    display: block; font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.3px;
    opacity: 0.75; margin-bottom: 1px;
  }
  .badge.bh { background: #f1f5f9; color: #334155; }
  .badge.bh.neg { background: #fef2f2; color: #b91c1c; }
  .badge.he { background: #f1f5f9; color: #334155; }
  .badge.bh strong, .badge.he strong { font-size: 14px; }

  /* Feriados pendentes com destaque */
  .badge.fer {
    background: #fffbeb; color: #92400e;
    border: 1px solid #fde68a;
  }
  .badge.fer.ok { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }

  /* ============================================
     FAIXA DE STATUS DE FÉRIAS
     ============================================ */
  .ferias-status {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    transition: all 0.2s;
  }
  .ferias-status.ok { background: #f0fdf4; color: #166534; border-color: #dcfce7; }
  .ferias-status.warning { background: #fffbeb; color: #92400e; border-color: #fef3c7; }
  .ferias-status.danger { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .ferias-status.neutral { background: #f8fafc; color: #475569; border-color: #e2e8f0; }

  .ferias-status .icon { font-size: 18px; }
  .ferias-status .text { flex: 1; }
  .ferias-status .text b { font-weight: 700; }

  /* ============================================
     STATS GRID
     ============================================ */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat {
    background: #f8fafc;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #f1f5f9;
  }
  .stat-label {
    font-size: 10px; color: #64748b; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px;
    margin-bottom: 3px;
  }
  .stat-value {
    font-size: 16px; font-weight: 700; color: #0f172a;
  }
  .stat-value.zero { color: #cbd5e1; }
  .stat-value.neg { color: #dc2626; }

  /* ============================================
     BOTÕES DE AÇÃO
     ============================================ */
  .actions-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding-top: 14px;
    border-top: 1px solid #f1f5f9;
  }
  .btn-action {
    padding: 7px 12px; border-radius: 7px;
    font-size: 12px; font-weight: 500;
    border: 1px solid #e2e8f0;
    background: white; color: #475569;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-action:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
    color: #0f172a;
  }
  .btn-action.primary {
    background: #1d4ed8; border-color: #1d4ed8; color: white;
    font-weight: 600;
  }
  .btn-action.primary:hover { background: #1e40af; border-color: #1e40af; }
  .btn-action.danger:hover {
    background: #fef2f2; border-color: #fecaca; color: #dc2626;
  }

  /* ============================================
     FORM CARD
     ============================================ */
  .form-card {
    background: white;
    padding: 24px 26px;
    border-radius: 14px;
    border: 1px solid #e3e8ef;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
    margin-bottom: 20px;
  }
  .form-card h3 {
    font-size: 15px; font-weight: 700; color: #0f172a;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid #f1f5f9;
    letter-spacing: -0.2px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .field { display: flex; flex-direction: column; }
  .field label {
    font-size: 11px; font-weight: 600; color: #475569;
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .field input, .field select, .field textarea {
    padding: 10px 12px;
    border: 1px solid #d1d9e3;
    border-radius: 8px;
    font-size: 14px; font-family: inherit;
    background: white; color: #0f172a;
    transition: all 0.18s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: #1d4ed8;
    box-shadow: 0 0 0 3px rgba(29,78,216,0.08);
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field.full { grid-column: 1/-1; }

  /* ============================================
     TABELAS
     ============================================ */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    padding: 11px 12px; text-align: left;
    border-bottom: 1px solid #f1f5f9;
  }
  th {
    background: #f8fafc; font-weight: 600;
    font-size: 11px; text-transform: uppercase;
    color: #64748b; letter-spacing: 0.3px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbfc; }

  .empty {
    text-align: center; padding: 48px 24px;
    color: #94a3b8; font-size: 14px;
  }
  .empty-icon { font-size: 40px; opacity: 0.3; margin-bottom: 12px; display: block; }

  /* ============================================
     BOTÕES GENÉRICOS
     ============================================ */
  .btn-sm {
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px; font-weight: 500;
    font-family: inherit;
    transition: all 0.15s;
    border: 1px solid #e2e8f0;
    background: white; color: #475569;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-sm:hover { background: #f8fafc; border-color: #cbd5e1; }
  .btn-sm.primary { background: #1d4ed8; border-color: #1d4ed8; color: white; font-weight: 600; }
  .btn-sm.primary:hover { background: #1e40af; }
  .btn-sm.danger { color: #dc2626; border-color: #fecaca; }
  .btn-sm.danger:hover { background: #fef2f2; }

  /* ============================================
     MODAL
     ============================================ */
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(15,23,42,0.5);
    backdrop-filter: blur(3px);
    z-index: 1000; padding: 20px; overflow-y: auto;
  }
  .modal.open { display: block; }
  .modal-box {
    background: white; max-width: 950px;
    margin: 40px auto; border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(15,23,42,0.2);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { transform: translateY(-12px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-head {
    background: white; color: #0f172a;
    padding: 20px 26px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #e3e8ef;
  }
  .modal-head h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .modal-close {
    background: none; border: none; color: #94a3b8;
    font-size: 24px; cursor: pointer;
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .modal-close:hover { background: #f1f5f9; color: #0f172a; }

  .modal-tabs {
    display: flex; gap: 2px;
    background: #f8fafc;
    padding: 8px 20px 0;
    border-bottom: 1px solid #e3e8ef;
    overflow-x: auto;
  }
  .modal-tab {
    padding: 10px 16px; border: none; background: none;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-weight: 500; font-size: 13px; color: #64748b;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .modal-tab:hover { color: #0f172a; }
  .modal-tab.active {
    color: #1d4ed8; border-bottom-color: #1d4ed8;
    background: white; font-weight: 600;
  }

  .modal-body { padding: 24px 26px; max-height: 70vh; overflow-y: auto; }
  .modal-pane { display: none; }
  .modal-pane.active { display: block; }

  /* Radio customizado */
  .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
  .radio-opt {
    flex: 1; min-width: 220px;
    background: #f8fafc; padding: 14px 16px;
    border-radius: 10px; border: 1px solid #e2e8f0;
    cursor: pointer; transition: all 0.15s;
  }
  .radio-opt:hover { border-color: #cbd5e1; background: white; }
  .radio-opt.selected { border-color: #1d4ed8; background: #eff6ff; }
  .radio-opt input { margin-right: 8px; }
  .radio-opt b { font-size: 13px; color: #0f172a; }
  .radio-opt small { display: block; color: #64748b; font-size: 11px; margin-top: 4px; margin-left: 22px; }

  /* ============================================
     TOAST
     ============================================ */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #0f172a; color: white;
    padding: 14px 20px; border-radius: 10px;
    box-shadow: 0 12px 32px rgba(15,23,42,0.2);
    font-weight: 500; font-size: 13px;
    display: none; z-index: 9999;
    max-width: 380px;
  }
  .toast.show { display: block; animation: slideIn 0.25s ease; }
  .toast.ok { background: #15803d; }
  .toast.err { background: #b91c1c; }
  @keyframes slideIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ============================================
     LOADING
     ============================================ */
  .loading { display: none; text-align: center; padding: 48px; color: #64748b; }
  .loading.show { display: block; }
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid #e2e8f0; border-radius: 50%;
    border-top-color: #1d4ed8;
    animation: spin 0.7s linear infinite;
    margin-right: 10px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .content { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .tabs { padding: 0 16px; }
    .emp-header { flex-direction: column; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .modal-body { padding: 18px; }
    .search-box { max-width: 100%; }
  }
</style>
</head>
<body>

<div class="topbar">

  <!-- ===================== INATIVOS ===================== -->

<div class="modal" id="modal">

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SHEET_ID = '1_jZmnHZSuj3J1IO9LtKCYPzgWrGLETUNusswhq-b2WQ';
const API_KEY  = 'AIzaSyAtHI0KGE9dWSQIQQtQLS95i3kuLTD0bSM';
const API_URL  = 'https://script.google.com/macros/s/AKfycbxCV_pL-xzrS9Q67MQeYRb_RESvCQVkkJTV6Ar9y29SHBEimCshgyoysdu7fPIKnec/exec';

const sessUser = sessionStorage.getItem('gestor_user');
const sessTipo = sessionStorage.getItem('gestor_tipo');
const sessNome = sessionStorage.getItem('gestor_nome');
if (!sessUser || sessTipo !== 'admin') location.href = 'index.html';

/* ============================================================
   ESTADO
   ============================================================ */
let cadastro = [], controle = [], faltas = [], advertencias = [];
let feriados = [], folgas = [], ferias = [];
let funcionarios = [];
let filtroNome = '';

/* ============================================================
   HELPERS
   ============================================================ */
function toast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + tipo;
  setTimeout(() => el.className = 'toast', 3500);
}

function parseNum(v) {
  if (v === '' || v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  return parseFloat(String(v).replace(/\s/g,'').replace(',','.')) || 0;
}

function fmtHoras(h) { return h.toFixed(2).replace('.', ',') + 'h'; }

function hojeStr() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function mesAnteriorStr() {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  return `${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function getDayOfWeek(dateStr) {
  if (!dateStr || !dateStr.includes('/')) return '';
  try {
    const [d,m,y] = dateStr.split('/');
    const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
    return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][dt.getDay()];
  } catch(e) { return ''; }
}

function dataToNum(dateStr) {
  if (!dateStr) return 0;
  try {
    const [d,m,y] = dateStr.split('/');
    return new Date(parseInt(y), parseInt(m)-1, parseInt(d)).getTime();
  } catch(e) { return 0; }
}

function diffDias(dateStr) {
  if (!dateStr) return 0;
  try {
    const [d,m,y] = dateStr.split('/');
    const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    return Math.floor((hoje - dt) / (1000*3600*24));
  } catch(e) { return 0; }
}

function addMeses(dateStr, meses) {
  try {
    const [d,m,y] = dateStr.split('/');
    const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
    dt.setMonth(dt.getMonth() + meses);
    return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
  } catch(e) { return ''; }
}

/* ============================================================
   API
   ============================================================ */
async function lerAba(nome) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${nome}!A2:Z?key=${API_KEY}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return (await resp.json()).values || [];
}

async function api(action, payload = {}) {
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  return resp.json();
}

    nome: (r[1]||'').toString().trim(),

/* ============================================================
   CONSOLIDAR
   ============================================================ */
function consolidar(nome) {
  const nomeL = nome.toLowerCase();
  const ctrl = controle.filter(c => c.funcionario.toLowerCase() === nomeL);
  const falt = faltas.filter(f => f.funcionario.toLowerCase() === nomeL);
  const adv  = advertencias.filter(a => a.funcionario.toLowerCase() === nomeL);
  const fer  = feriados.filter(f => f.funcionario.toLowerCase() === nomeL);
  const folg = folgas.filter(f => f.funcionario.toLowerCase() === nomeL);
  const fer2 = ferias.filter(f => f.funcionario.toLowerCase() === nomeL);

  let totalBH = ctrl.reduce((s,c) => s + c.saldoBanco, 0);
  const folgasBanco = folg.filter(f => f.origem === 'banco');
  totalBH -= folgasBanco.length * 8;

  const totalHE = ctrl.reduce((s,c) => s + c.horaExtra, 0);
  const feriadosPendentes = fer.filter(f => f.status === 'pendente').length;

  return {
    ctrl, falt, adv, feriados: fer, folg, fer2,
    totalBH, totalHE,
    faltasJust: falt.filter(f => f.comAtestado).length,
    faltasInjust: falt.filter(f => !f.comAtestado).length,
    advertenciasCount: adv.length,
    feriadosPendentes,
    folgasBancoCount: folgasBanco.length
  };
}

/* ============================================================
   LÓGICA DE FÉRIAS (regras novas)
   ============================================================
   - Primeira férias: prazo limite = admissão + 1 ano e 8 meses
   - A partir da segunda: prazo limite = última férias (retorno) + 10 meses
   ============================================================ */
function calcularStatusFerias(f, dados) {
  if (!f.data_admissao) {
    return { tipo: 'neutral', icon: 'ℹ️', msg: 'Data de admissão não cadastrada' };
  }

  const nomeL = f.nome.toLowerCase();
  const feriasPessoa = dados.fer2.filter(x => x.funcionario.toLowerCase() === nomeL);
  const feriasValidas = feriasPessoa.filter(x => x.status === 'agendada' || x.status === 'gozada');

  // Última férias (maior data de retorno)
  const ultima = feriasValidas
    .slice()
    .sort((a,b) => dataToNum(b.retorno) - dataToNum(a.retorno))[0];

  if (!ultima) {
    // Nunca teve férias — primeira férias
    const admissao = f.data_admissao;
    const diasAdmissao = diffDias(admissao);
    const diasParaUmAno = 365 - diasAdmissao;

    if (diasAdmissao < 365) {
      return {
        tipo: 'neutral', icon: '📅',
        msg: `Faltam <b>${diasParaUmAno} dias</b> para completar 1 ano`
      };
    }

    // Completo 1 ano
    const limite = addMeses(admissao, 20); // 1 ano e 8 meses = 20 meses
    const diasParaLimite = diffDias(limite) * -1; // dias faltando (positivo)

    if (diasParaLimite > 90) {
      // Ainda longe do limite (mais de 3 meses)
      const diasDesde1Ano = diasAdmissao - 365;
      return {
        tipo: 'ok', icon: '✅',
        msg: `Direito a férias desde ${addMeses(admissao, 12)} · Agendar até <b>${limite}</b>`
      };
    } else if (diasParaLimite > 0) {
      // Menos de 3 meses para o limite
      return {
        tipo: 'warning', icon: '⚠️',
        msg: `Atenção: agendar férias até <b>${limite}</b> (${diasParaLimite} dias)`
      };
    } else {
      // Passou do limite (1 ano e 8 meses)
      const diasAtraso = Math.abs(diasParaLimite);
      return {
        tipo: 'danger', icon: '🔴',
        msg: `ATRASO de <b>${diasAtraso} dias</b> — agende urgentemente`
      };
    }
  }

  // Já teve férias — prazo = último retorno + 10 meses
  const ultimoRetorno = ultima.retorno;
  const limite = addMeses(ultimoRetorno, 10);
  const diasParaLimite = diffDias(limite) * -1;
  const diasDesdeRetorno = diffDias(ultimoRetorno);

  if (diasDesdeRetorno < 30) {
    return {
      tipo: 'ok', icon: '✅',
      msg: `Férias recentes (retornou em ${ultimoRetorno})`
    };
  }

  if (diasParaLimite > 60) {
    return {
      tipo: 'ok', icon: '📅',
      msg: `Agendar próxima até <b>${limite}</b>`
    };
  } else if (diasParaLimite > 0) {
    return {
      tipo: 'warning', icon: '⚠️',
      msg: `Agendar até <b>${limite}</b> (${diasParaLimite} dias)`
    };
  } else {
    const diasAtraso = Math.abs(diasParaLimite);
    return {
      tipo: 'danger', icon: '🔴',
      msg: `ATRASO de <b>${diasAtraso} dias</b> — agende urgentemente`
    };
  }
}

document.querySelectorAll('.tab').forEach(t => {

    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));

});

/* ============================================================
   MODAL
   ============================================================ */
function abrirModal(titulo, html, opts = {}) {
  document.getElementById('modal-title').textContent = titulo;
  const tabsWrap = document.getElementById('modal-tabs-wrap');
  const body = document.getElementById('modal-body');

  if (opts.tabs) {
    tabsWrap.innerHTML = `<div class="modal-tabs">${
      opts.tabs.map((t, i) => `<button class="modal-tab ${i===0?'active':''}" data-mtab="${t.id}">${t.label}</button>`).join('')
    }</div>`;
    body.innerHTML = opts.tabs.map((t, i) => `<div class="modal-pane ${i===0?'active':''}" id="mpane-${t.id}">${t.html}</div>`).join('');
    document.querySelectorAll('.modal-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.modal-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.modal-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('mpane-' + btn.dataset.mtab).classList.add('active');
      });
    });
  } else {
    tabsWrap.innerHTML = '';
    body.innerHTML = html;
  }
  document.getElementById('modal').classList.add('open');
}

function fecharModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') fecharModal(); });

function abrirLancamento(empId) {
  const f = cadastro.find(c => c.id === empId);
  if (!f) return;

  const tabs = [
    { id: 'ctrl', label: '📊 Mensal',      html: formControle(f) },
    { id: 'falt', label: '📋 Faltas',      html: formFalta(f) },
    { id: 'adv',  label: '⚖️ Advertências', html: formAdvertencia(f) },
    { id: 'fer',  label: '🏖️ Feriados',    html: formFeriado(f) },
    { id: 'folg', label: '📆 Folgas',      html: formFolga(f) },
    { id: 'feri', label: '🌴 Férias',      html: formFerias(f) }
  ];

  abrirModal('Lançar — ' + f.nome, '', { tabs });
}

function selecionarOrigem(origem) {

/* ============================================================
   GERENCIAR PESSOAS
   ============================================================ */
function limparFormFunc() {
  ['f-id','f-nome','f-senha','f-admissao','f-obs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-tipo').value = 'funcionario';
  document.getElementById('func-editing-id').value = '';
  document.getElementById('form-func-title').textContent = 'Nova Pessoa';
  document.getElementById('f-id').disabled = false;
}

function editarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!f) return;
  document.getElementById('f-id').value = f.id;
  document.getElementById('f-id').disabled = true;
  document.getElementById('f-nome').value = f.nome;
  document.getElementById('f-tipo').value = f.tipo;
  document.getElementById('f-senha').value = f.senha;
  document.getElementById('f-admissao').value = f.data_admissao;
  document.getElementById('f-obs').value = f.observacao;
  document.getElementById('func-editing-id').value = f.id;
  document.getElementById('form-func-title').textContent = 'Editando: ' + f.nome;
  document.querySelector('.tab[data-pane="funcs"]').click();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function salvarPessoa() {
  const editId = document.getElementById('func-editing-id').value;
  const id     = document.getElementById('f-id').value.trim().toLowerCase();
  const nome   = document.getElementById('f-nome').value.trim();
  const tipo   = document.getElementById('f-tipo').value;
  const senha  = document.getElementById('f-senha').value.trim();
  const adm    = document.getElementById('f-admissao').value.trim();
  const obs    = document.getElementById('f-obs').value.trim();
  if (!id || !nome || !senha) return toast('Preencha ID, Nome e Senha', 'err');

  let r;
  if (editId) r = await api('updateCadastro', { id: editId, nome, tipo, senha, data_admissao: adm, observacao: obs });
  else r = await api('addCadastro', { id, nome, tipo, senha, data_admissao: adm, observacao: obs });

  if (r.ok) { toast('Salvo!'); limparFormFunc(); await recarregar(); }
  else toast(r.error || 'Erro', 'err');
}

async function inativarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!confirm(`Desativar "${f.nome}"?`)) return;
  const r = await api('setStatusCadastro', { id, status: 'inativo' });
  if (r.ok) { toast('Inativado'); await recarregar(); }
  else toast(r.error || 'Erro', 'err');
}

async function reativarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!confirm(`Reativar "${f.nome}"?`)) return;
  const r = await api('setStatusCadastro', { id, status: 'ativo' });
  if (r.ok) { toast('Reativado'); await recarregar(); }
  else toast(r.error || 'Erro', 'err');
}

   ============================================================ */
function logout() { sessionStorage.clear(); location.href = 'index.html'; }

async function recarregar() {
  document.getElementById('load-banco').classList.add('show');
  try {
    await Promise.all([
      carregarCadastro(), carregarControle(), carregarFaltas(),
      carregarAdvertencias(), carregarFeriados(), carregarFolgas(), carregarFerias()
    ]);
    renderBanco(); renderFuncs(); renderInativos();
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
  finally { document.getElementById('load-banco').classList.remove('show'); }
}

recarregar();
</script>
