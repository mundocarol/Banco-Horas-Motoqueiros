<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Horas - Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f8fafc; color: #1e293b; -webkit-font-smoothing: antialiased;
  }
  .topbar {
    background: #0f172a; color: white; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 12px;
  }
  .topbar h1 { font-size: 18px; font-weight: 700; }
  .topbar h1 span { color: #60a5fa; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .nav-btn {
    background: rgba(255,255,255,0.08); color: white;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.15); }
  .logout-btn {
    background: #475569; color: white;
    border: none; padding: 8px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .logout-btn:hover { background: #334155; }

  .tabs {
    background: white; border-bottom: 2px solid #e2e8f0;
    padding: 0 24px; display: flex; gap: 4px;
    position: sticky; top: 68px; z-index: 99; overflow-x: auto;
  }
  .tab {
    padding: 14px 22px; cursor: pointer;
    font-weight: 600; font-size: 14px; color: #64748b;
    border: none; background: none;
    border-bottom: 3px solid transparent;
    transition: all 0.2s; white-space: nowrap; font-family: inherit;
  }
  .tab:hover { color: #0f172a; background: #f8fafc; }
  .tab.active { color: #2563eb; border-bottom-color: #2563eb; background: #eff6ff; }

  .content { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .pane { display: none; }
  .pane.active { display: block; }

  .emp-card {
    background: white; padding: 22px 24px;
    border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    border: 1px solid #eef2f6; margin-bottom: 20px; transition: all 0.2s;
  }
  .emp-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.07); }
  .emp-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
  }
  .emp-nome { font-size: 19px; font-weight: 700; color: #0f172a; }
  .emp-sub { font-size: 12px; color: #64748b; margin-top: 2px; }
  .saldo-wrap { display: flex; gap: 10px; flex-wrap: wrap; }
  .saldo {
    padding: 8px 16px; border-radius: 10px;
    font-size: 15px; font-weight: 700; text-align: center;
  }
  .saldo small { display: block; font-size: 10px; font-weight: 600; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
  .saldo.bh { background: #f0f9ff; color: #0369a1; }
  .saldo.bh.neg { background: #fef2f2; color: #dc2626; }
  .saldo.he { background: #fef3c7; color: #92400e; }
  .saldo.fp { background: #fee2e2; color: #991b1b; }
  .saldo.fp.ok { background: #dcfce7; color: #166534; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
    gap: 10px; margin-bottom: 14px;
  }
  .stat { background: #f8fafc; padding: 12px 14px; border-radius: 10px; border: 1px solid #eef2f6; }
  .stat-label {
    font-size: 10px; color: #64748b; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .stat-value { font-size: 18px; font-weight: 700; color: #0f172a; }

  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn-sm {
    padding: 8px 14px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 12px; font-weight: 600;
    transition: all 0.2s; font-family: inherit;
  }
  .btn-sm:hover { transform: translateY(-1px); filter: brightness(0.95); }
  .b-green   { background: #dcfce7; color: #166534; }
  .b-red     { background: #fee2e2; color: #991b1b; }
  .b-yellow  { background: #fef9c3; color: #854d0e; }
  .b-blue    { background: #dbeafe; color: #1e40af; }
  .b-purple  { background: #f3e8ff; color: #6b21a8; }
  .b-cyan    { background: #cffafe; color: #155e75; }
  .b-orange  { background: #ffedd5; color: #9a3412; }
  .b-dark    { background: #1e293b; color: white; }
  .b-primary { background: #3b82f6; color: white; }
  .b-ghost   { background: #f1f5f9; color: #475569; }

  .form-card {
    background: white; padding: 24px;
    border-radius: 16px; border: 1px solid #eef2f6;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 24px;
  }
  .form-card h3 {
    margin-bottom: 18px; font-size: 17px; font-weight: 700;
    padding-bottom: 10px; border-bottom: 2px solid #e2e8f0;
  }
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .field { display: flex; flex-direction: column; }
  .field label {
    font-size: 11px; font-weight: 600; color: #475569;
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .field input, .field select, .field textarea {
    padding: 10px 12px; border: 1px solid #cbd5e1;
    border-radius: 9px; font-size: 14px;
    font-family: inherit; background: white; transition: all 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field.full { grid-column: 1/-1; }
  .field.disabled input { background: #f1f5f9; color: #64748b; }

  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(15,23,42,0.75); backdrop-filter: blur(4px);
    z-index: 1000; padding: 20px; overflow-y: auto;
  }
  .modal.open { display: block; }
  .modal-box {
    background: white; max-width: 950px;
    margin: 30px auto; border-radius: 16px;
    overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.3);
  }
  .modal-head {
    background: #0f172a; color: white; padding: 16px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-head h3 { font-size: 17px; font-weight: 700; }
  .modal-close {
    background: none; border: none; color: #94a3b8;
    font-size: 26px; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: rgba(255,255,255,0.1); color: white; }

  .modal-tabs {
    display: flex; gap: 2px; background: #f1f5f9;
    padding: 8px; border-bottom: 1px solid #e2e8f0; overflow-x: auto;
  }
  .modal-tab {
    padding: 10px 16px; border: none; background: none;
    border-radius: 8px; cursor: pointer;
    font-weight: 600; font-size: 13px; color: #64748b;
    font-family: inherit; transition: all 0.2s; white-space: nowrap;
  }
  .modal-tab:hover { color: #0f172a; background: white; }
  .modal-tab.active { background: #0f172a; color: white; }

  .modal-body { padding: 24px; max-height: 65vh; overflow-y: auto; }
  .modal-pane { display: none; }
  .modal-pane.active { display: block; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  th {
    background: #f1f5f9; font-weight: 600;
    font-size: 11px; text-transform: uppercase;
    color: #475569; letter-spacing: 0.3px;
  }
  tr:hover { background: #f8fafc; }
  .empty { text-align: center; padding: 40px; color: #94a3b8; font-size: 14px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #0f172a; color: white;
    padding: 14px 22px; border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    font-weight: 600; font-size: 14px;
    display: none; z-index: 9999; max-width: 400px;
  }
  .toast.show { display: block; animation: slideIn 0.3s; }
  .toast.ok { background: #16a34a; }
  .toast.err { background: #dc2626; }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }

  .loading { display: none; text-align: center; padding: 40px; color: #64748b; }
  .loading.show { display: block; }
  .spinner {
    display: inline-block; width: 24px; height: 24px;
    border: 3px solid #e2e8f0; border-radius: 50%;
    border-top-color: #3b82f6;
    animation: spin 0.8s linear infinite;
    margin-right: 10px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
  .radio-opt {
    flex: 1; min-width: 200px;
    background: #f8fafc; padding: 14px;
    border-radius: 10px; border: 2px solid #e2e8f0;
    cursor: pointer; transition: all 0.2s;
  }
  .radio-opt:hover { border-color: #cbd5e1; background: white; }
  .radio-opt.selected { border-color: #3b82f6; background: #eff6ff; }
  .radio-opt input { margin-right: 8px; }
  .radio-opt b { font-size: 13px; }
  .radio-opt small { display: block; color: #64748b; font-size: 11px; margin-top: 4px; margin-left: 22px; }

  @media (max-width: 768px) {
    .content { padding: 14px; }
    .topbar { padding: 12px 14px; }
    .topbar h1 { font-size: 15px; }
    .tabs { padding: 0 12px; }
    .tab { padding: 12px 14px; font-size: 13px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .modal-body { padding: 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>📊 <span>Painel Admin</span> — Banco de Horas</h1>
  <div class="topbar-actions">
    <a href="motoqueiros.html" class="nav-btn">🏍️ Motoqueiros</a>
    <button class="logout-btn" onclick="logout()">🚪 Sair</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-pane="banco">🏦 Banco de Horas</button>
  <button class="tab" data-pane="funcs">👥 Gerenciar Funcionários</button>
  <button class="tab" data-pane="inativos">📁 Inativos</button>
</div>

<div class="content">
  <div class="pane active" id="pane-banco">
    <div class="loading" id="load-banco"><span class="spinner"></span> Carregando...</div>
    <div id="lista-funcionarios"></div>
  </div>
  <div class="pane" id="pane-funcs">
    <div class="form-card">
      <h3 id="form-func-title">➕ Novo Funcionário / Motoqueiro</h3>
      <input type="hidden" id="func-editing-id">
      <div class="form-grid">
        <div class="field"><label>ID (login)</label><input type="text" id="f-id" placeholder="ex: joao"></div>
        <div class="field"><label>Nome Completo</label><input type="text" id="f-nome" placeholder="ex: João Silva"></div>
        <div class="field"><label>Tipo</label>
          <select id="f-tipo">
            <option value="funcionario">Funcionário</option>
            <option value="motoqueiro">Motoqueiro</option>
          </select>
        </div>
        <div class="field"><label>Senha</label><input type="text" id="f-senha" placeholder="ex: joao123"></div>
        <div class="field"><label>Data Admissão</label><input type="text" id="f-admissao" placeholder="dd/mm/aaaa"></div>
        <div class="field full"><label>Observação</label><input type="text" id="f-obs" placeholder="Opcional"></div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn-sm b-primary" onclick="salvarFuncionario()">💾 Salvar</button>
        <button class="btn-sm b-ghost" onclick="limparFormFunc()">Limpar</button>
      </div>
    </div>
    <div class="form-card">
      <h3>👥 Todos os Ativos</h3>
      <div id="tabela-funcs"></div>
    </div>
  </div>
  <div class="pane" id="pane-inativos">
    <div class="form-card">
      <h3>📁 Desligados</h3>
      <p style="color:#64748b; font-size:13px; margin-bottom:16px">
        Não aparecem no login. Dados preservados.
      </p>
      <div id="tabela-inativos"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title">Título</h3>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div id="modal-tabs-wrap"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SHEET_ID = '1_jZmnHZSuj3J1IO9LtKCYPzgWrGLETUNusswhq-b2WQ';
const API_KEY  = 'AIzaSyAtHI0KGE9dWSQIQQtQLS95i3kuLTD0bSM';
const API_URL  = 'https://script.google.com/macros/s/AKfycbxCV_pL-xzrS9Q67MQeYRb_RESvCQVkkJTV6Ar9y29SHBEimCshgyoysdu7fPIKnec/exec';

const sessUser = sessionStorage.getItem('gestor_user');
const sessTipo = sessionStorage.getItem('gestor_tipo');
const sessNome = sessionStorage.getItem('gestor_nome');
if (!sessUser || sessTipo !== 'admin') location.href = 'index.html';

/* ============================================================
   ESTADO
   ============================================================ */
let cadastro = [], controle = [], faltas = [], advertencias = [];
let feriados = [], folgas = [], ferias = [], funcionarios = [];

/* ============================================================
   HELPERS
   ============================================================ */
function toast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + tipo;
  setTimeout(() => el.className = 'toast', 4000);
}

function parseNum(v) {
  if (v === '' || v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  return parseFloat(String(v).replace(/\s/g,'').replace(',','.')) || 0;
}

function fmtHoras(h) { return h.toFixed(2).replace('.', ',') + 'h'; }

function hojeStr() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function mesAnteriorStr() {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  return `${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function getDayOfWeek(dateStr) {
  if (!dateStr || !dateStr.includes('/')) return '';
  try {
    const [d,m,y] = dateStr.split('/');
    const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
    return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][dt.getDay()];
  } catch(e) { return ''; }
}

function dataToNum(dateStr) {
  if (!dateStr) return 0;
  try {
    const [d,m,y] = dateStr.split('/');
    return new Date(parseInt(y), parseInt(m)-1, parseInt(d)).getTime();
  } catch(e) { return 0; }
}

/* ============================================================
   API
   ============================================================ */
async function lerAba(nome) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${nome}!A2:Z?key=${API_KEY}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return (await resp.json()).values || [];
}

async function api(action, payload = {}) {
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  return resp.json();
}

/* ============================================================
   CARREGAR
   ============================================================ */
async function carregarCadastro() {
  const linhas = await lerAba('Cadastro');
  cadastro = linhas.map((r, i) => ({
    id: (r[0]||'').toString().trim().toLowerCase(),
    nome: (r[1]||'').toString().trim(),
    tipo: (r[2]||'').toString().trim().toLowerCase(),
    senha: (r[3]||'').toString().trim(),
    status: (r[4]||'').toString().trim().toLowerCase(),
    data_admissao: (r[5]||'').toString().trim(),
    data_desligamento: (r[6]||'').toString().trim(),
    observacao: (r[7]||'').toString().trim(),
    _row: i + 2
  })).filter(c => c.id);
  funcionarios = cadastro.filter(c => c.tipo === 'funcionario' && c.status === 'ativo');
}

async function carregarControle() {
  const linhas = await lerAba('Controle');
  controle = linhas.map((r, i) => ({
    funcionario: (r[0]||'').toString().trim(),
    mesAno: (r[1]||'').toString().trim(),
    saldoBanco: parseNum(r[2]),
    horaExtra: parseNum(r[3]),
    observacao: (r[4]||'').toString().trim(),
    lancadoEm: (r[5]||'').toString().trim(),
    lancadoPor: (r[6]||'').toString().trim(),
    _row: i + 2
  })).filter(c => c.funcionario);
}

async function carregarFaltas() {
  const linhas = await lerAba('Faltas');
  faltas = linhas.map((r, i) => ({
    funcionario: (r[0]||'').toString().trim(),
    data: (r[1]||'').toString().trim(),
    comAtestado: r[2] === '1',
    observacao: (r[3]||'').toString().trim(),
    lancadoEm: (r[4]||'').toString().trim(),
    _row: i + 2
  })).filter(f => f.funcionario);
}

async function carregarAdvertencias() {
  const linhas = await lerAba('Advertencias');
  advertencias = linhas.map((r, i) => ({
    funcionario: (r[0]||'').toString().trim(),
    data: (r[1]||'').toString().trim(),
    motivo: (r[2]||'').toString().trim(),
    lancadoEm: (r[3]||'').toString().trim(),
    _row: i + 2
  })).filter(a => a.funcionario);
}

async function carregarFeriados() {
  const linhas = await lerAba('Feriados');
  feriados = linhas.map((r, i) => ({
    funcionario: (r[0]||'').toString().trim(),
    data: (r[1]||'').toString().trim(),
    folgaVinculada: parseInt(r[2]) || 0,
    status: (r[3]||'pendente').toString().trim().toLowerCase(),
    lancadoEm: (r[4]||'').toString().trim(),
    _row: i + 2
  })).filter(f => f.funcionario);
}

async function carregarFolgas() {
  const linhas = await lerAba('Folgas');
  folgas = linhas.map((r, i) => ({
    funcionario: (r[0]||'').toString().trim(),
    data: (r[1]||'').toString().trim(),
    origem: (r[2]||'').toString().trim().toLowerCase(),
    feriadoVinculado: parseInt(r[3]) || 0,
    lancadoEm: (r[4]||'').toString().trim(),
    _row: i + 2
  })).filter(f => f.funcionario);
}

async function carregarFerias() {
  const linhas = await lerAba('Ferias');
  ferias = linhas.map((r, i) => ({
    funcionario: (r[0]||'').toString().trim(),
    inicio: (r[1]||'').toString().trim(),
    dias: parseInt(r[2]) || 0,
    fim: (r[3]||'').toString().trim(),
    retorno: (r[4]||'').toString().trim(),
    status: (r[5]||'').toString().trim().toLowerCase() || 'agendada',
    _row: i + 2
  })).filter(f => f.funcionario);
}

/* ============================================================
   CONSOLIDAR
   ============================================================ */
function consolidar(nome) {
  const nomeL = nome.toLowerCase();
  const ctrl = controle.filter(c => c.funcionario.toLowerCase() === nomeL);
  const falt = faltas.filter(f => f.funcionario.toLowerCase() === nomeL);
  const adv  = advertencias.filter(a => a.funcionario.toLowerCase() === nomeL);
  const fer  = feriados.filter(f => f.funcionario.toLowerCase() === nomeL);
  const folg = folgas.filter(f => f.funcionario.toLowerCase() === nomeL);
  const fer2 = ferias.filter(f => f.funcionario.toLowerCase() === nomeL);

  // Saldo BH = soma dos saldos MENOS as folgas que debitam banco (não têm vínculo feriado)
  let totalBH = ctrl.reduce((s,c) => s + c.saldoBanco, 0);
  const folgasBanco = folg.filter(f => f.origem === 'banco');
  totalBH -= folgasBanco.length * 8; // cada folga do banco = 8h

  const totalHE = ctrl.reduce((s,c) => s + c.horaExtra, 0);

  const feriadosPendentes = fer.filter(f => f.status === 'pendente').length;

  return {
    ctrl, falt, adv, feriados: fer, folg, fer2,
    totalBH, totalHE,
    faltasJust: falt.filter(f => f.comAtestado).length,
    faltasInjust: falt.filter(f => !f.comAtestado).length,
    advertenciasCount: adv.length,
    feriadosPendentes,
    folgasBancoCount: folgasBanco.length
  };
}

/* ============================================================
   RENDER — BANCO
   ============================================================ */
function renderBanco() {
  const c = document.getElementById('lista-funcionarios');
  if (!funcionarios.length) {
    c.innerHTML = '<div class="empty">Nenhum funcionário ativo.</div>';
    return;
  }

  c.innerHTML = funcionarios.map(f => {
    const d = consolidar(f.nome);
    const bhClass = d.totalBH < 0 ? 'neg' : '';
    const fpClass = d.feriadosPendentes > 0 ? '' : 'ok';
    return `
      <div class="emp-card">
        <div class="emp-header">

    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));

/* ============================================================
   MODAL GENÉRICO
   ============================================================ */
function abrirModal(titulo, html, opts = {}) {
  document.getElementById('modal-title').textContent = titulo;
  const tabsWrap = document.getElementById('modal-tabs-wrap');
  const body = document.getElementById('modal-body');

  if (opts.tabs) {
    tabsWrap.innerHTML = `<div class="modal-tabs">${
      opts.tabs.map((t, i) => `<button class="modal-tab ${i===0?'active':''}" data-mtab="${t.id}">${t.label}</button>`).join('')
    }</div>`;
    body.innerHTML = opts.tabs.map((t, i) => `<div class="modal-pane ${i===0?'active':''}" id="mpane-${t.id}">${t.html}</div>`).join('');
    document.querySelectorAll('.modal-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.modal-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.modal-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('mpane-' + btn.dataset.mtab).classList.add('active');
      });
    });
  } else {
    tabsWrap.innerHTML = '';
    body.innerHTML = html;
  }
  document.getElementById('modal').classList.add('open');
}

function fecharModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') fecharModal(); });

/* ============================================================

   ============================================================ */
function abrirLancamento(empId) {
  const f = cadastro.find(c => c.id === empId);
  if (!f) return;

  const tabs = [
    { id: 'ctrl', label: '📊 Mensal',      html: formControle(f) },
    { id: 'falt', label: '📋 Faltas',      html: formFalta(f) },
    { id: 'adv',  label: '⚖️ Advertências', html: formAdvertencia(f) },
    { id: 'fer',  label: '🏖️ Feriados',    html: formFeriado(f) },
    { id: 'folg', label: '📆 Folgas',      html: formFolga(f) },
    { id: 'feri', label: '🌴 Férias',      html: formFerias(f) }
  ];

  abrirModal('➕ Lançamento — ' + f.nome, '', { tabs });
}

function formFeriado(f) {
  return `
    <div style="background:#fef3c7; padding:12px; border-radius:8px; font-size:13px; color:#92400e; margin-bottom:16px; border-left:3px solid #f59e0b">
      ℹ️ Feriado trabalhado gera <b>direito a uma folga</b>. Não afeta o saldo do banco de horas.
      Ao lançar uma folga com origem <b>"Pagar feriado"</b>, o feriado mais antigo pendente já vem selecionado.

function formFolga(f) {
  // Busca feriados pendentes desse funcionário, ordenados por data (mais antigo primeiro)
  const pendentes = feriados
    .filter(x => x.funcionario.toLowerCase() === f.nome.toLowerCase() && x.status === 'pendente')
    .sort((a, b) => dataToNum(a.data) - dataToNum(b.data));

  const optionsFeriado = pendentes.length
    ? pendentes.map((x, idx) => `
        <option value="${x._row}" ${idx===0?'selected':''}>
          ${x.data} (${getDayOfWeek(x.data)})${idx===0?' — mais antigo':''}
        </option>
      `).join('')
    : '<option value="">— Nenhum feriado pendente —</option>';

  const semPendentes = pendentes.length === 0;

  return `
    <div class="form-grid">
      <div class="field"><label>Data da Folga</label><input type="text" id="folg-data" value="${hojeStr()}"></div>
    </div>

    <div class="field full" style="margin-bottom:16px">
      <label>Origem da Folga</label>
      <div class="radio-group">
        <label class="radio-opt ${!semPendentes ? 'selected' : ''}" onclick="selecionarOrigem('feriado')" id="opt-feriado">
          <input type="radio" name="folg-origem" value="feriado" ${!semPendentes ? 'checked' : 'disabled'}>
          <b>🏖️ Pagar Feriado Trabalhado</b>
          <small>${semPendentes ? 'Nenhum feriado pendente' : pendentes.length + ' feriado(s) pendente(s)'}</small>
        </label>
        <label class="radio-opt ${semPendentes ? 'selected' : ''}" onclick="selecionarOrigem('banco')" id="opt-banco">
          <input type="radio" name="folg-origem" value="banco" ${semPendentes ? 'checked' : ''}>
          <b>📊 Debitar do Banco de Horas</b>
          <small>Desconta 8h do saldo</small>
        </label>
      </div>
    </div>

    <div id="folg-feriado-wrap" style="${semPendentes ? 'display:none' : ''}; margin-bottom:16px">
      <div class="field">
        <label>Feriado a Compensar</label>
        <select id="folg-feriado">${optionsFeriado}</select>
      </div>
      <small style="color:#64748b; font-size:11px; margin-top:6px; display:block">
        💡 O feriado mais antigo já vem selecionado. Você pode trocar.
      </small>
    </div>

    <button class="btn-sm b-primary" onclick="salvarFolga('${f.nome}')">💾 Salvar Folga</button>
  `;
}

function selecionarOrigem(origem) {
  document.querySelectorAll('.radio-opt').forEach(el => el.classList.remove('selected'));
  document.getElementById('opt-' + origem).classList.add('selected');
  document.querySelectorAll('input[name="folg-origem"]').forEach(r => {
    r.checked = r.value === origem;
  });
  document.getElementById('folg-feriado-wrap').style.display = origem === 'feriado' ? 'block' : 'none';
}

function formFerias(f) {

/* ============================================================
   SALVAR
   ============================================================ */
async function salvarControle(nome) {
  const p = {
    funcionario: nome,
    mesAno: document.getElementById('ctrl-mes').value.trim(),
    saldoBanco: document.getElementById('ctrl-bh').value.trim(),
    horaExtra: document.getElementById('ctrl-he').value.trim(),
    observacao: document.getElementById('ctrl-obs').value.trim(),
    lancadoPor: sessNome || 'admin'
  };
  if (!p.mesAno) return toast('Informe o Mês/Ano', 'err');
  const r = await api('addControle', p);
  if (r.ok) { toast('✅ Lançamento salvo!'); fecharModal(); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

async function salvarFalta(nome) {
  const p = {
    funcionario: nome,
    data: document.getElementById('falta-data').value.trim(),
    comAtestado: document.getElementById('falta-atestado').value === '1',
    observacao: document.getElementById('falta-obs').value.trim()
  };
  if (!p.data) return toast('Informe a data', 'err');
  const r = await api('addFalta', p);
  if (r.ok) { toast('✅ Falta salva!'); fecharModal(); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

async function salvarAdvertencia(nome) {
  const p = {
    funcionario: nome,
    data: document.getElementById('adv-data').value.trim(),
    motivo: document.getElementById('adv-motivo').value.trim()
  };
  if (!p.data || !p.motivo) return toast('Preencha data e motivo', 'err');
  const r = await api('addAdvertencia', p);
  if (r.ok) { toast('✅ Advertência salva!'); fecharModal(); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

async function salvarFeriado(nome) {
  const p = {
    funcionario: nome,
    data: document.getElementById('fer-data').value.trim()
  };
  if (!p.data) return toast('Informe a data do feriado', 'err');
  const r = await api('addFeriado', p);
  if (r.ok) { toast('✅ Feriado salvo!'); fecharModal(); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

async function salvarFolga(nome) {
  const origem = document.querySelector('input[name="folg-origem"]:checked').value;
  const p = {
    funcionario: nome,
    data: document.getElementById('folg-data').value.trim(),
    origem: origem
  };
  if (!p.data) return toast('Informe a data da folga', 'err');
  if (origem === 'feriado') {
    const ferRow = document.getElementById('folg-feriado').value;
    if (!ferRow) return toast('Nenhum feriado pendente', 'err');
    p.feriadoRow = ferRow;
  }
  const r = await api('addFolga', p);
  if (r.ok) { toast('✅ Folga salva!'); fecharModal(); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

async function salvarFerias(nome) {

    inicio: document.getElementById('feri-inicio').value.trim(),

            <td><b>${x.inicio}</b></td>
            <td>${x.fim}</td>
            <td>${x.retorno}</td>
            <td>${x.dias}</td>
            <td>${x.status}</td>
            <td><button class="btn-sm b-red" onclick="apagar('deleteFerias',${x._row})">🗑️</button></td>
          </tr>
        `).join('')}
      </tbody></table>`
    : '<div class="empty">Nenhum período de férias.</div>';
  abrirModal('🌴 Férias — ' + f.nome, html);
}

/* ============================================================
   APAGAR
   ============================================================ */
async function apagar(action, rowIndex) {
  if (!confirm('Apagar esta linha? Esta ação não pode ser desfeita.')) return;
  const r = await api(action, { rowIndex });
  if (r.ok) { toast('🗑️ Apagado'); fecharModal(); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

/* ============================================================
   GERENCIAR FUNCIONÁRIOS
   ============================================================ */
function limparFormFunc() {
  ['f-id','f-nome','f-senha','f-admissao','f-obs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-tipo').value = 'funcionario';
  document.getElementById('func-editing-id').value = '';
  document.getElementById('form-func-title').textContent = '➕ Novo Funcionário / Motoqueiro';
  document.getElementById('f-id').disabled = false;
}

function editarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!f) return;
  document.getElementById('f-id').value = f.id;
  document.getElementById('f-id').disabled = true;
  document.getElementById('f-nome').value = f.nome;
  document.getElementById('f-tipo').value = f.tipo;
  document.getElementById('f-senha').value = f.senha;
  document.getElementById('f-admissao').value = f.data_admissao;
  document.getElementById('f-obs').value = f.observacao;
  document.getElementById('func-editing-id').value = f.id;
  document.getElementById('form-func-title').textContent = '✏️ Editando: ' + f.nome;
  document.querySelector('.tab[data-pane="funcs"]').click();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function salvarFuncionario() {
  const editId = document.getElementById('func-editing-id').value;
  const id     = document.getElementById('f-id').value.trim().toLowerCase();
  const nome   = document.getElementById('f-nome').value.trim();
  const tipo   = document.getElementById('f-tipo').value;
  const senha  = document.getElementById('f-senha').value.trim();
  const adm    = document.getElementById('f-admissao').value.trim();
  const obs    = document.getElementById('f-obs').value.trim();
  if (!id || !nome || !senha) return toast('Preencha ID, Nome e Senha', 'err');

  let r;
  if (editId) r = await api('updateCadastro', { id: editId, nome, senha, data_admissao: adm, observacao: obs });
  else r = await api('addCadastro', { id, nome, tipo, senha, data_admissao: adm, observacao: obs });

  if (r.ok) { toast('✅ Salvo!'); limparFormFunc(); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

async function inativarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!confirm(`Desativar "${f.nome}"?`)) return;
  const r = await api('setStatusCadastro', { id, status: 'inativo' });
  if (r.ok) { toast('🚫 Inativado'); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

async function reativarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!confirm(`Reativar "${f.nome}"?`)) return;
  const r = await api('setStatusCadastro', { id, status: 'ativo' });
  if (r.ok) { toast('✅ Reativado'); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

/* ============================================================
   LOGOUT / RECARREGAR
   ============================================================ */
function logout() { sessionStorage.clear(); location.href = 'index.html'; }

async function recarregar() {
  document.getElementById('load-banco').classList.add('show');
  try {
    await Promise.all([
      carregarCadastro(), carregarControle(), carregarFaltas(),
      carregarAdvertencias(), carregarFeriados(), carregarFolgas(), carregarFerias()
    ]);
    renderBanco(); renderFuncs(); renderInativos();
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
  finally { document.getElementById('load-banco').classList.remove('show'); }
}

recarregar();
</script>
