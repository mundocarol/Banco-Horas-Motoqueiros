<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Horas - Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f8fafc; color: #1e293b;
    -webkit-font-smoothing: antialiased;
  }

  /* TOPBAR */
  .topbar {
    background: #0f172a; color: white; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 12px;
  }
  .topbar h1 { font-size: 18px; font-weight: 700; }
  .topbar h1 span { color: #60a5fa; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .nav-btn {
    background: rgba(255,255,255,0.08); color: white;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.15); }
  .logout-btn {
    background: #475569; color: white;
    border: none; padding: 8px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .logout-btn:hover { background: #334155; }

  /* TABS */
  .tabs {
    background: white; border-bottom: 2px solid #e2e8f0;
    padding: 0 24px; display: flex; gap: 4px;
    position: sticky; top: 68px; z-index: 99; overflow-x: auto;
  }
  .tab {
    padding: 14px 22px; cursor: pointer;
    font-weight: 600; font-size: 14px; color: #64748b;
    border: none; background: none;
    border-bottom: 3px solid transparent;
    transition: all 0.2s; white-space: nowrap; font-family: inherit;
  }
  .tab:hover { color: #0f172a; background: #f8fafc; }
  .tab.active { color: #2563eb; border-bottom-color: #2563eb; background: #eff6ff; }

  .content { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .pane { display: none; }
  .pane.active { display: block; }

  /* CARD FUNCIONÁRIO */
  .emp-card {
    background: white; padding: 22px 24px;
    border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    border: 1px solid #eef2f6; margin-bottom: 20px;
    transition: all 0.2s;
  }
  .emp-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.07); }
  .emp-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
  }
  .emp-nome { font-size: 19px; font-weight: 700; color: #0f172a; }
  .emp-sub { font-size: 12px; color: #64748b; margin-top: 2px; }
  .saldo-wrap { display: flex; gap: 10px; flex-wrap: wrap; }
  .saldo {
    padding: 8px 16px; border-radius: 10px;
    font-size: 15px; font-weight: 700; text-align: center;
  }
  .saldo small { display: block; font-size: 10px; font-weight: 600; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
  .saldo.bh { background: #f0f9ff; color: #0369a1; }
  .saldo.bh.neg { background: #fef2f2; color: #dc2626; }
  .saldo.he { background: #fef3c7; color: #92400e; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
    gap: 10px; margin-bottom: 14px;
  }
  .stat {
    background: #f8fafc; padding: 12px 14px;
    border-radius: 10px; border: 1px solid #eef2f6;
  }
  .stat-label {
    font-size: 10px; color: #64748b; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .stat-value { font-size: 18px; font-weight: 700; color: #0f172a; }

  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn-sm {
    padding: 8px 14px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 12px; font-weight: 600;
    transition: all 0.2s; font-family: inherit;
  }
  .btn-sm:hover { transform: translateY(-1px); filter: brightness(0.95); }
  .b-green   { background: #dcfce7; color: #166534; }
  .b-red     { background: #fee2e2; color: #991b1b; }
  .b-yellow  { background: #fef9c3; color: #854d0e; }
  .b-blue    { background: #dbeafe; color: #1e40af; }
  .b-purple  { background: #f3e8ff; color: #6b21a8; }
  .b-cyan    { background: #cffafe; color: #155e75; }
  .b-orange  { background: #ffedd5; color: #9a3412; }
  .b-dark    { background: #1e293b; color: white; }
  .b-primary { background: #3b82f6; color: white; }
  .b-ghost   { background: #f1f5f9; color: #475569; }

  /* FORM */
  .form-card {
    background: white; padding: 24px;
    border-radius: 16px; border: 1px solid #eef2f6;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 24px;
  }
  .form-card h3 {
    margin-bottom: 18px; font-size: 17px; font-weight: 700;
    padding-bottom: 10px; border-bottom: 2px solid #e2e8f0;
  }
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .field { display: flex; flex-direction: column; }
  .field label {
    font-size: 11px; font-weight: 600; color: #475569;
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .field input, .field select, .field textarea {
    padding: 10px 12px; border: 1px solid #cbd5e1;
    border-radius: 9px; font-size: 14px;
    font-family: inherit; background: white; transition: all 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field.full { grid-column: 1/-1; }

  /* MODAL */
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(15,23,42,0.75); backdrop-filter: blur(4px);
    z-index: 1000; padding: 20px; overflow-y: auto;
  }
  .modal.open { display: block; }
  .modal-box {
    background: white; max-width: 950px;
    margin: 30px auto; border-radius: 16px;
    overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.3);
  }
  .modal-head {
    background: #0f172a; color: white; padding: 16px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-head h3 { font-size: 17px; font-weight: 700; }
  .modal-close {
    background: none; border: none; color: #94a3b8;
    font-size: 26px; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.1); color: white; }

  /* SUB-TABS DO MODAL */
  .modal-tabs {
    display: flex; gap: 2px; background: #f1f5f9;
    padding: 8px; border-bottom: 1px solid #e2e8f0;
    overflow-x: auto;
  }
  .modal-tab {
    padding: 10px 18px; border: none; background: none;
    border-radius: 8px; cursor: pointer;
    font-weight: 600; font-size: 13px; color: #64748b;
    font-family: inherit; transition: all 0.2s; white-space: nowrap;
  }
  .modal-tab:hover { color: #0f172a; background: white; }
  .modal-tab.active { background: #0f172a; color: white; }

  .modal-body { padding: 24px; max-height: 65vh; overflow-y: auto; }
  .modal-pane { display: none; }
  .modal-pane.active { display: block; }

  /* TABELA */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  th {
    background: #f1f5f9; font-weight: 600;
    font-size: 11px; text-transform: uppercase;
    color: #475569; letter-spacing: 0.3px;
  }
  tr:hover { background: #f8fafc; }
  .empty {
    text-align: center; padding: 40px;
    color: #94a3b8; font-size: 14px;
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #0f172a; color: white;
    padding: 14px 22px; border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    font-weight: 600; font-size: 14px;
    display: none; z-index: 9999; max-width: 400px;
  }
  .toast.show { display: block; animation: slideIn 0.3s; }
  .toast.ok { background: #16a34a; }
  .toast.err { background: #dc2626; }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }

  /* LOADING */
  .loading { display: none; text-align: center; padding: 40px; color: #64748b; }
  .loading.show { display: block; }
  .spinner {
    display: inline-block; width: 24px; height: 24px;
    border: 3px solid #e2e8f0; border-radius: 50%;
    border-top-color: #3b82f6;
    animation: spin 0.8s linear infinite;
    margin-right: 10px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .content { padding: 14px; }
    .topbar { padding: 12px 14px; }
    .topbar h1 { font-size: 15px; }
    .tabs { padding: 0 12px; }
    .tab { padding: 12px 14px; font-size: 13px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .modal-body { padding: 16px; }
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <h1>📊 <span>Painel Admin</span> — Banco de Horas</h1>
  <div class="topbar-actions">
    <a href="motoqueiros.html" class="nav-btn">🏍️ Motoqueiros</a>
    <button class="logout-btn" onclick="logout()">🚪 Sair</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" data-pane="banco">🏦 Banco de Horas</button>
  <button class="tab" data-pane="funcs">👥 Gerenciar Funcionários</button>
  <button class="tab" data-pane="inativos">📁 Inativos</button>
</div>

<div class="content">

  <!-- PANE BANCO -->
  <div class="pane active" id="pane-banco">
    <div class="loading" id="load-banco"><span class="spinner"></span> Carregando...</div>
    <div id="lista-funcionarios"></div>
  </div>

  <!-- PANE FUNCIONÁRIOS -->
  <div class="pane" id="pane-funcs">
    <div class="form-card">
      <h3 id="form-func-title">➕ Novo Funcionário / Motoqueiro</h3>
      <input type="hidden" id="func-editing-id">
      <div class="form-grid">
        <div class="field">
          <label>ID (login, sem espaços)</label>
          <input type="text" id="f-id" placeholder="ex: joao">
        </div>
        <div class="field">
          <label>Nome Completo</label>
          <input type="text" id="f-nome" placeholder="ex: João Silva">
        </div>
        <div class="field">
          <label>Tipo</label>
          <select id="f-tipo">
            <option value="funcionario">Funcionário</option>
            <option value="motoqueiro">Motoqueiro</option>
          </select>
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="text" id="f-senha" placeholder="ex: joao123">
        </div>
        <div class="field">
          <label>Data Admissão</label>
          <input type="text" id="f-admissao" placeholder="dd/mm/aaaa">
        </div>
        <div class="field full">
          <label>Observação</label>
          <input type="text" id="f-obs" placeholder="Opcional">
        </div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn-sm b-primary" onclick="salvarFuncionario()">💾 Salvar</button>
        <button class="btn-sm b-ghost" onclick="limparFormFunc()">Limpar</button>
      </div>
    </div>

    <div class="form-card">
      <h3>👥 Todos os Ativos</h3>
      <div id="tabela-funcs"></div>
    </div>
  </div>

  <!-- PANE INATIVOS -->
  <div class="pane" id="pane-inativos">
    <div class="form-card">
      <h3>📁 Desligados</h3>
      <p style="color:#64748b; font-size:13px; margin-bottom:16px">
        Não aparecem no login. Dados preservados para uso jurídico.
      </p>
      <div id="tabela-inativos"></div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title">Título</h3>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div id="modal-tabs-wrap"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SHEET_ID = '1_jZmnHZSuj3J1IO9LtKCYPzgWrGLETUNusswhq-b2WQ';
const API_KEY  = 'AIzaSyAtHI0KGE9dWSQIQQtQLS95i3kuLTD0bSM';
const API_URL  = 'https://script.google.com/macros/s/AKfycbxCV_pL-xzrS9Q67MQeYRb_RESvCQVkkJTV6Ar9y29SHBEimCshgyoysdu7fPIKnec/exec';

const SESSION_KEY = 'gestor_user';
const sessUser = sessionStorage.getItem('gestor_user');
const sessTipo = sessionStorage.getItem('gestor_tipo');
const sessNome = sessionStorage.getItem('gestor_nome');
if (!sessUser || sessTipo !== 'admin') location.href = 'index.html';

/* ============================================================
   ESTADO
   ============================================================ */
let cadastro = [];
let controle = [];
let faltas = [];
let advertencias = [];
let folgas = [];
let ferias = [];
let funcionarios = [];

/* ============================================================
   HELPERS
   ============================================================ */
function toast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + tipo;
  setTimeout(() => el.className = 'toast', 4000);
}

function parseNum(v) {
  if (v === '' || v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  return parseFloat(String(v).replace(/\s/g,'').replace(',','.')) || 0;
}

function fmtHoras(h) { return h.toFixed(2).replace('.', ',') + 'h'; }

function hojeStr() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function mesAnteriorStr() {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() - 1);
  return `${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function getDayOfWeek(dateStr) {
  if (!dateStr || !dateStr.includes('/')) return '';
  try {
    const [d,m,y] = dateStr.split('/');
    const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
    return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][dt.getDay()];
  } catch(e) { return ''; }
}

/* ============================================================
   API
   ============================================================ */
async function lerAba(nome) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${nome}!A2:Z?key=${API_KEY}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const data = await resp.json();
  return data.values || [];
}

async function api(action, payload = {}) {
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  return resp.json();
}

/* ============================================================
   CARREGAR TUDO
   ============================================================ */
async function carregarCadastro() {
  const linhas = await lerAba('Cadastro');
  cadastro = linhas.map((r, i) => ({
    id:                (r[0]||'').toString().trim().toLowerCase(),
    nome:              (r[1]||'').toString().trim(),
    tipo:              (r[2]||'').toString().trim().toLowerCase(),
    senha:             (r[3]||'').toString().trim(),
    status:            (r[4]||'').toString().trim().toLowerCase(),
    data_admissao:     (r[5]||'').toString().trim(),
    data_desligamento: (r[6]||'').toString().trim(),
    observacao:        (r[7]||'').toString().trim(),
    _row:              i + 2
  })).filter(c => c.id);

  funcionarios = cadastro.filter(c => c.tipo === 'funcionario' && c.status === 'ativo');
}

async function carregarControle() {
  const linhas = await lerAba('Controle');
  controle = linhas.map((r, i) => ({
    funcionario:  (r[0]||'').toString().trim(),
    mesAno:       (r[1]||'').toString().trim(),
    saldoBanco:   parseNum(r[2]),
    horaExtra:    parseNum(r[3]),
    observacao:   (r[4]||'').toString().trim(),
    lancadoEm:    (r[5]||'').toString().trim(),
    lancadoPor:   (r[6]||'').toString().trim(),
    _row:         i + 2
  })).filter(c => c.funcionario);
}

async function carregarFaltas() {
  const linhas = await lerAba('Faltas');
  faltas = linhas.map((r, i) => ({
    funcionario:  (r[0]||'').toString().trim(),
    data:         (r[1]||'').toString().trim(),
    comAtestado:  r[2] === '1',
    observacao:   (r[3]||'').toString().trim(),
    lancadoEm:    (r[4]||'').toString().trim(),
    _row:         i + 2
  })).filter(f => f.funcionario);
}

async function carregarAdvertencias() {
  const linhas = await lerAba('Advertencias');
  advertencias = linhas.map((r, i) => ({
    funcionario: (r[0]||'').toString().trim(),
    data:        (r[1]||'').toString().trim(),
    motivo:      (r[2]||'').toString().trim(),
    lancadoEm:   (r[3]||'').toString().trim(),
    _row:        i + 2
  })).filter(a => a.funcionario);
}

async function carregarFolgas() {
  const linhas = await lerAba('Folgas');
  folgas = linhas.map((r, i) => ({
    funcionario: (r[0]||'').toString().trim(),
    data:        (r[1]||'').toString().trim(),
    origem:      (r[2]||'').toString().trim(),
    status:      (r[3]||'').toString().trim().toLowerCase() || 'agendada',
    lancadoEm:   (r[4]||'').toString().trim(),
    _row:        i + 2
  })).filter(f => f.funcionario);
}

async function carregarFerias() {
  const linhas = await lerAba('Ferias');
  ferias = linhas.map((r, i) => ({
    funcionario: (r[0]||'').toString().trim(),
    inicio:      (r[1]||'').toString().trim(),
    dias:        parseInt(r[2]) || 0,
    fim:         (r[3]||'').toString().trim(),
    retorno:     (r[4]||'').toString().trim(),
    status:      (r[5]||'').toString().trim().toLowerCase() || 'agendada',
    _row:        i + 2
  })).filter(f => f.funcionario);
}

/* ============================================================
   PROCESSAR — dados consolidados de um funcionário
   ============================================================ */
function consolidar(nome) {
  const nomeL = nome.toLowerCase();

  const ctrl = controle.filter(c => c.funcionario.toLowerCase() === nomeL);
  const falt = faltas.filter(f => f.funcionario.toLowerCase() === nomeL);
  const adv  = advertencias.filter(a => a.funcionario.toLowerCase() === nomeL);
  const folg = folgas.filter(f => f.funcionario.toLowerCase() === nomeL);
  const fer  = ferias.filter(f => f.funcionario.toLowerCase() === nomeL);

  const totalBH = ctrl.reduce((s,c) => s + c.saldoBanco, 0);
  const totalHE = ctrl.reduce((s,c) => s + c.horaExtra, 0);
  const faltasJust = falt.filter(f => f.comAtestado).length;
  const faltasInjust = falt.filter(f => !f.comAtestado).length;
  const folgasAtivas = folg.filter(f => f.status === 'agendada').length;

  return {
    ctrl, falt, adv, folg, fer,
    totalBH, totalHE,
    faltasJust, faltasInjust,
    advertenciasCount: adv.length,
    folgasAtivas
  };
}

/* ============================================================
   RENDERIZAR — BANCO DE HORAS
   ============================================================ */
function renderBanco() {
  const c = document.getElementById('lista-funcionarios');
  if (!funcionarios.length) {
    c.innerHTML = '<div class="empty">Nenhum funcionário ativo. Vá em <b>Gerenciar Funcionários</b>.</div>';
    return;
  }

  c.innerHTML = funcionarios.map(f => {
    const d = consolidar(f.nome);
    const saldoClass = d.totalBH < 0 ? 'neg' : '';
    return `
      <div class="emp-card">
        <div class="emp-header">
          <div>
            <div class="emp-nome">👤 ${f.nome}</div>
            <div class="emp-sub">${f.data_admissao ? '📅 Admitido em ' + f.data_admissao : 'Sem data de admissão'}</div>
          </div>
          <div class="saldo-wrap">
            <div class="saldo bh ${saldoClass}">
              <small>Banco Horas</small>
              ${fmtHoras(d.totalBH)}
            </div>
            <div class="saldo he">
              <small>Horas Extras</small>
              ${fmtHoras(d.totalHE)}
            </div>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><div class="stat-label">✅ Faltas Just.</div><div class="stat-value">${d.faltasJust}</div></div>
          <div class="stat"><div class="stat-label">❌ Faltas Injust.</div><div class="stat-value">${d.faltasInjust}</div></div>
          <div class="stat"><div class="stat-label">⚖️ Advertências</div><div class="stat-value">${d.advertenciasCount}</div></div>

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));
    t.classList.add('active');

/* ============================================================
   MODAL GENÉRICO
   ============================================================ */
function abrirModal(titulo, html, opts = {}) {
  document.getElementById('modal-title').textContent = titulo;
  const tabsWrap = document.getElementById('modal-tabs-wrap');
  const body = document.getElementById('modal-body');

  if (opts.tabs) {
    tabsWrap.innerHTML = `
      <div class="modal-tabs">
        ${opts.tabs.map((t, i) => `
          <button class="modal-tab ${i===0?'active':''}" data-mtab="${t.id}">${t.label}</button>
        `).join('')}
      </div>
    `;
    body.innerHTML = opts.tabs.map((t, i) => `
      <div class="modal-pane ${i===0?'active':''}" id="mpane-${t.id}">${t.html}</div>
    `).join('');
    document.querySelectorAll('.modal-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.modal-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.modal-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('mpane-' + btn.dataset.mtab).classList.add('active');
      });
    });
  } else {
    tabsWrap.innerHTML = '';
    body.innerHTML = html;
  }

  document.getElementById('modal').classList.add('open');
}

function fecharModal() {
  document.getElementById('modal').classList.remove('open');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') fecharModal();
});

    </tbody></table>` : '<p style="color:#94a3b8; font-size:12px">Nenhuma.</p>'}

    <h3 style="font-size:14px; margin:20px 0 10px; padding-bottom:6px; border-bottom:1px solid #e2e8f0">📆 Folgas</h3>
    ${d.folg.length ? `<table style="margin-bottom:20px"><thead><tr><th>Data</th><th>Origem</th><th>Status</th></tr></thead><tbody>
      ${d.folg.map(x => `<tr><td>${x.data}</td><td>${x.origem||'—'}</td><td>${x.status}</td></tr>`).join('')}
    </tbody></table>` : '<p style="color:#94a3b8; font-size:12px">Nenhuma.</p>'}

    <h3 style="font-size:14px; margin:20px 0 10px; padding-bottom:6px; border-bottom:1px solid #e2e8f0">🏖️ Férias</h3>
    ${d.fer.length ? `<table style="margin-bottom:20px"><thead><tr><th>Início</th><th>Fim</th><th>Retorno</th><th>Dias</th><th>Status</th></tr></thead><tbody>
      ${d.fer.map(x => `<tr><td>${x.inicio}</td><td>${x.fim}</td><td>${x.retorno}</td><td>${x.dias}</td><td>${x.status}</td></tr>`).join('')}
    </tbody></table>` : '<p style="color:#94a3b8; font-size:12px">Nenhuma.</p>'}

    <div style="margin-top:24px; padding-top:14px; border-top:2px solid #1e293b; text-align:center; font-size:10px; color:#94a3b8">
      <p>Sistema de Banco de Horas · Documento com validade documental</p>
      <p>Emitido em ${agora}</p>
    </div>
  `;
  abrirModal('📋 Relatório — ' + f.nome, html);
}

/* ============================================================
   GERENCIAR FUNCIONÁRIOS
   ============================================================ */
function limparFormFunc() {
  ['f-id','f-nome','f-senha','f-admissao','f-obs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-tipo').value = 'funcionario';
  document.getElementById('func-editing-id').value = '';
  document.getElementById('form-func-title').textContent = '➕ Novo Funcionário / Motoqueiro';
  document.getElementById('f-id').disabled = false;
}

function editarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!f) return;
  document.getElementById('f-id').value = f.id;
  document.getElementById('f-id').disabled = true;
  document.getElementById('f-nome').value = f.nome;
  document.getElementById('f-tipo').value = f.tipo;
  document.getElementById('f-senha').value = f.senha;
  document.getElementById('f-admissao').value = f.data_admissao;
  document.getElementById('f-obs').value = f.observacao;
  document.getElementById('func-editing-id').value = f.id;
  document.getElementById('form-func-title').textContent = '✏️ Editando: ' + f.nome;
  document.querySelector('.tab[data-pane="funcs"]').click();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function salvarFuncionario() {
  const editId = document.getElementById('func-editing-id').value;
  const id     = document.getElementById('f-id').value.trim().toLowerCase();
  const nome   = document.getElementById('f-nome').value.trim();
  const tipo   = document.getElementById('f-tipo').value;
  const senha  = document.getElementById('f-senha').value.trim();
  const adm    = document.getElementById('f-admissao').value.trim();
  const obs    = document.getElementById('f-obs').value.trim();
  if (!id || !nome || !senha) return toast('Preencha ID, Nome e Senha', 'err');

  let r;
  if (editId) r = await api('updateCadastro', { id: editId, nome, senha, data_admissao: adm, observacao: obs });
  else r = await api('addCadastro', { id, nome, tipo, senha, data_admissao: adm, observacao: obs });

  if (r.ok) { toast('✅ Salvo!'); limparFormFunc(); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

async function inativarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!confirm(`Desativar "${f.nome}"?`)) return;
  const r = await api('setStatusCadastro', { id, status: 'inativo' });
  if (r.ok) { toast('🚫 Inativado'); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

async function reativarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!confirm(`Reativar "${f.nome}"?`)) return;
  const r = await api('setStatusCadastro', { id, status: 'ativo' });
  if (r.ok) { toast('✅ Reativado'); await recarregar(); }
  else toast('❌ ' + (r.error || 'Erro'), 'err');
}

/* ============================================================
   LOGOUT
   ============================================================ */
function logout() {
  sessionStorage.clear();
  location.href = 'index.html';
}

/* ============================================================
   RECARREGAR TUDO
   ============================================================ */
async function recarregar() {
  document.getElementById('load-banco').classList.add('show');
  try {
    await Promise.all([
      carregarCadastro(),
      carregarControle(),
      carregarFaltas(),
      carregarAdvertencias(),
      carregarFolgas(),
      carregarFerias()
    ]);
    renderBanco();
    renderFuncs();
    renderInativos();
  } catch(e) {
    toast('Erro: ' + e.message, 'err');
  } finally {
    document.getElementById('load-banco').classList.remove('show');
  }
}

/* INICIALIZA */
recarregar();
</script>
