<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Horas - Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #dfe4eb;
    color: #1e293b;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .topbar {
    background: #0f172a; color: white;
    padding: 14px 32px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(15,23,42,0.12);
    flex-wrap: wrap; gap: 12px;
  }
  .topbar h1 {
    font-size: 16px; font-weight: 700;
    letter-spacing: -0.2px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar h1 .dot {
    display: inline-block; width: 8px; height: 8px;
    background: #3b82f6; border-radius: 50%;
  }
  .topbar h1 span { color: #93c5fd; font-weight: 500; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .nav-btn {
    background: rgba(255,255,255,0.06); color: #cbd5e1;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.18s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.12); color: white; }
  .logout-btn {
    background: transparent; color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.18s;
  }
  .logout-btn:hover { background: rgba(239,68,68,0.12); color: #fca5a5; }

  .tabs-wrap {
    background: white;
    border-bottom: 1px solid #dbe1ea;
    position: sticky; top: 60px; z-index: 99;
  }
  .tabs {
    max-width: 1400px; margin: 0 auto;
    padding: 0 32px;
    display: flex; gap: 4px; overflow-x: auto;
  }
  .tab {
    padding: 16px 20px; cursor: pointer;
    font-weight: 500; font-size: 14px; color: #64748b;
    border: none; background: none;
    border-bottom: 2px solid transparent;
    transition: all 0.18s; white-space: nowrap;
    font-family: inherit;
    display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: #0f172a; }
  .tab.active { color: #1d4ed8; border-bottom-color: #1d4ed8; font-weight: 600; }

  .content { max-width: 1400px; margin: 0 auto; padding: 28px 32px; }
  .pane { display: none; }
  .pane.active { display: block; }

  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; gap: 16px; flex-wrap: wrap;
  }
  .search-box { position: relative; flex: 1; max-width: 420px; }
  .search-box input {
    width: 100%; padding: 12px 16px 12px 42px;
    border: 1px solid #d1d9e3; background: white;
    border-radius: 10px; font-size: 14px; font-family: inherit;
    color: #0f172a; transition: all 0.18s;
  }
  .search-box input:focus {
    outline: none; border-color: #1d4ed8;
    box-shadow: 0 0 0 3px rgba(29,78,216,0.1);
  }
  .search-box::before {
    content: ''; position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); width: 16px; height: 16px;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3ccircle cx='11' cy='11' r='8'%3e%3c/circle%3e%3cpath d='m21 21-4.35-4.35'%3e%3c/path%3e%3c/svg%3e");
    background-size: cover; opacity: 0.6;
  }

  .emp-card {
    background: white; padding: 22px 24px; border-radius: 14px;
    border: 1px solid #e3e8ef; box-shadow: 0 2px 8px rgba(15,23,42,0.06);
    margin-bottom: 14px; transition: all 0.2s ease;
  }
  .emp-card:hover {
    box-shadow: 0 6px 20px rgba(15,23,42,0.1);
    border-color: #cbd5e1;
  }
  .emp-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
    padding-bottom: 16px; border-bottom: 1px solid #f1f5f9;
  }
  .emp-info { flex: 1; min-width: 200px; }
  .emp-nome {
    font-size: 17px; font-weight: 700; color: #0f172a;
    letter-spacing: -0.2px; margin-bottom: 4px;
  }
  .emp-meta {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: #64748b;
  }
  .emp-meta span { display: flex; align-items: center; gap: 5px; }

  .emp-badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    padding: 6px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    letter-spacing: -0.1px;
  }
  .badge small {
    display: block; font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.3px;
    opacity: 0.75; margin-bottom: 1px;
  }
  .badge.bh { background: #f1f5f9; color: #334155; }
  .badge.bh.neg { background: #fef2f2; color: #b91c1c; }
  .badge.he { background: #f1f5f9; color: #334155; }
  .badge.bh strong, .badge.he strong { font-size: 14px; }
  .badge.fer { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  .badge.fer.ok { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }

  .ferias-status {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: 10px;
    margin-bottom: 16px; font-size: 13px; font-weight: 500;
    border: 1px solid transparent; transition: all 0.2s;
  }
  .ferias-status.ok { background: #f0fdf4; color: #166534; border-color: #dcfce7; }
  .ferias-status.warning { background: #fffbeb; color: #92400e; border-color: #fef3c7; }
  .ferias-status.danger { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .ferias-status.neutral { background: #f8fafc; color: #475569; border-color: #e2e8f0; }
  .ferias-status .icon { font-size: 18px; }
  .ferias-status .text { flex: 1; }
  .ferias-status .text b { font-weight: 700; }

  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px; margin-bottom: 16px;
  }
  .stat {
    background: #f8fafc; padding: 10px 12px;
    border-radius: 8px; border: 1px solid #f1f5f9;
  }
  .stat-label {
    font-size: 10px; color: #64748b; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px;
  }
  .stat-value { font-size: 16px; font-weight: 700; color: #0f172a; }
  .stat-value.zero { color: #cbd5e1; }
  .stat-value.neg { color: #dc2626; }

  .actions-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding-top: 14px; border-top: 1px solid #f1f5f9;
  }
  .btn-action {
    padding: 7px 12px; border-radius: 7px;
    font-size: 12px; font-weight: 500;
    border: 1px solid #e2e8f0;
    background: white; color: #475569;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-action:hover {
    background: #f8fafc; border-color: #cbd5e1; color: #0f172a;
  }
  .btn-action.primary {
    background: #1d4ed8; border-color: #1d4ed8; color: white; font-weight: 600;
  }
  .btn-action.primary:hover { background: #1e40af; border-color: #1e40af; }
  .btn-action.danger:hover {
    background: #fef2f2; border-color: #fecaca; color: #dc2626;
  }

  .form-card {
    background: white; padding: 24px 26px;
    border-radius: 14px; border: 1px solid #e3e8ef;
    box-shadow: 0 2px 8px rgba(15,23,42,0.06);
    margin-bottom: 20px;
  }
  .form-card h3 {
    font-size: 15px; font-weight: 700; color: #0f172a;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid #f1f5f9; letter-spacing: -0.2px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .field { display: flex; flex-direction: column; }
  .field label {
    font-size: 11px; font-weight: 600; color: #475569;
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .field input, .field select, .field textarea {
    padding: 10px 12px; border: 1px solid #d1d9e3;
    border-radius: 8px; font-size: 14px; font-family: inherit;
    background: white; color: #0f172a; transition: all 0.18s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: #1d4ed8;
    box-shadow: 0 0 0 3px rgba(29,78,216,0.08);
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field.full { grid-column: 1/-1; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid #f1f5f9; }
  th {
    background: #f8fafc; font-weight: 600;
    font-size: 11px; text-transform: uppercase;
    color: #64748b; letter-spacing: 0.3px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbfc; }

  .empty {
    text-align: center; padding: 48px 24px;
    color: #94a3b8; font-size: 14px;
  }
  .empty-icon { font-size: 40px; opacity: 0.3; margin-bottom: 12px; display: block; }

  .btn-sm {
    padding: 8px 14px; border-radius: 8px;
    cursor: pointer; font-size: 12px; font-weight: 500;
    font-family: inherit; transition: all 0.15s;
    border: 1px solid #e2e8f0;
    background: white; color: #475569;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-sm:hover { background: #f8fafc; border-color: #cbd5e1; }
  .btn-sm.primary { background: #1d4ed8; border-color: #1d4ed8; color: white; font-weight: 600; }
  .btn-sm.primary:hover { background: #1e40af; }
  .btn-sm.danger { color: #dc2626; border-color: #fecaca; }
  .btn-sm.danger:hover { background: #fef2f2; }

  /* MODAL */
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(15,23,42,0.65);
    backdrop-filter: blur(3px);
    z-index: 1000; padding: 20px; overflow-y: auto;
  }
  .modal.open { display: block; }
  .modal-box {
    background: white; max-width: 1000px;
    margin: 40px auto; border-radius: 16px;
    overflow: hidden; box-shadow: 0 24px 60px rgba(15,23,42,0.3);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { transform: translateY(-12px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-head {
    background: white; color: #0f172a; padding: 20px 26px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #e3e8ef;
    position: sticky; top: 0; background: white; z-index: 10;
  }
  .modal-head h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .modal-head .sub { font-size: 12px; color: #64748b; font-weight: 400; margin-top: 2px; }
  .modal-close {
    background: none; border: none; color: #94a3b8;
    font-size: 24px; cursor: pointer;
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .modal-close:hover { background: #f1f5f9; color: #0f172a; }
  .modal-body { padding: 24px 26px; max-height: 78vh; overflow-y: auto; }

  .mes-escolha {
    padding: 20px 0; text-align: center;
  }
  .mes-escolha p {
    color: #475569; font-size: 14px; margin-bottom: 20px;
  }
  .mes-escolha-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; max-width: 400px; margin: 0 auto 24px;
  }
  .mes-escolha-grid select {
    padding: 14px 16px; border: 1px solid #d1d9e3;
    border-radius: 10px; font-size: 16px; font-family: inherit;
    text-align: center; background: white; color: #0f172a;
  }
  .mes-escolha-grid select:focus {
    outline: none; border-color: #1d4ed8;
    box-shadow: 0 0 0 3px rgba(29,78,216,0.1);
  }

  .section {
    background: #f8fafc;
    border: 1px solid #dbe1ea;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .section-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 14px; font-weight: 700; color: #0f172a;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .count {
    background: #e2e8f0; color: #475569;
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    font-weight: 600;
  }

  .row-item {
    display: grid;
    grid-template-columns: 2fr 1.5fr 3fr 40px;
    gap: 8px;
    align-items: center;
    background: white;
    padding: 10px 12px;
    border: 1px solid #e3e8ef;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .row-item.adv { grid-template-columns: 1.5fr 4fr 40px; }
  .row-item.fer { grid-template-columns: 2fr 3fr 40px; }
  .row-item.fol { grid-template-columns: 2fr 2fr 3fr 40px; }
  .row-item.fol.sem-feriado { grid-template-columns: 2fr 2fr 1fr 40px; }

  .row-item input, .row-item select {
    padding: 8px 10px; border: 1px solid #d1d9e3;
    border-radius: 6px; font-size: 13px; font-family: inherit;
    background: white; color: #0f172a; width: 100%;
  }
  .row-item input:focus, .row-item select:focus {
    outline: none; border-color: #1d4ed8;
    box-shadow: 0 0 0 2px rgba(29,78,216,0.08);
  }
  .row-item select:disabled {
    background: #f1f5f9; color: #94a3b8; cursor: not-allowed;
  }
  .row-del {
    width: 32px; height: 32px;
    background: #fef2f2; color: #dc2626;
    border: 1px solid #fecaca;
    border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .row-del:hover { background: #fee2e2; border-color: #fca5a5; }

  .empty-row {
    text-align: center; padding: 16px;
    color: #94a3b8; font-size: 12px;
    font-style: italic;
  }

  .add-btn {
    background: white; color: #1d4ed8;
    border: 1px dashed #93c5fd;
    padding: 8px 16px; border-radius: 8px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .add-btn:hover { background: #eff6ff; border-color: #1d4ed8; }

  .salvar-tudo-bar {
    position: sticky; bottom: 0;
    background: white;
    padding: 16px 0 0;
    margin-top: 20px;
    border-top: 2px solid #f1f5f9;
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .btn-salvar-tudo {
    background: #1d4ed8; color: white;
    border: none; padding: 14px 32px;
    border-radius: 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-salvar-tudo:hover { background: #1e40af; }
  .btn-salvar-tudo:disabled { background: #93c5fd; cursor: not-allowed; }

  .btn-cancelar-modal {
    background: #f1f5f9; color: #475569;
    border: none; padding: 14px 24px;
    border-radius: 10px; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .btn-cancelar-modal:hover { background: #e2e8f0; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #0f172a; color: white;
    padding: 14px 20px; border-radius: 10px;
    box-shadow: 0 12px 32px rgba(15,23,42,0.3);
    font-weight: 500; font-size: 13px;
    display: none; z-index: 9999; max-width: 380px;
  }
  .toast.show { display: block; animation: slideIn 0.25s ease; }
  .toast.ok { background: #15803d; }
  .toast.err { background: #b91c1c; }
  .toast.info { background: #1d4ed8; }
  @keyframes slideIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .loading { display: none; text-align: center; padding: 48px; color: #64748b; }
  .loading.show { display: block; }
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid #e2e8f0; border-radius: 50%;
    border-top-color: #1d4ed8;
    animation: spin 0.7s linear infinite;
    margin-right: 10px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .content { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .tabs { padding: 0 16px; }
    .emp-header { flex-direction: column; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .modal-body { padding: 18px; }
    .search-box { max-width: 100%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1><span class="dot"></span>Painel Administrativo <span>· Banco de Horas</span></h1>
  <div class="topbar-actions">
    <a href="motoqueiros.html" class="nav-btn">🏍️ Motoqueiros</a>
    <button class="logout-btn" onclick="logout()">Sair</button>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" data-pane="banco">📊 Banco de Horas</button>
    <button class="tab" data-pane="funcs">👥 Gerenciar Pessoas</button>
    <button class="tab" data-pane="inativos">📁 Inativos</button>
  </div>
</div>

<div class="content">

  <div class="pane active" id="pane-banco">
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="filtro-nome" placeholder="Buscar por nome..." oninput="filtrarFuncionarios()">
      </div>
    </div>
    <div class="loading" id="load-banco"><span class="spinner"></span> Carregando...</div>
    <div id="lista-funcionarios"></div>
  </div>

  <div class="pane" id="pane-funcs">
    <div class="form-card">
      <h3 id="form-func-title">Nova Pessoa</h3>
      <input type="hidden" id="func-editing-id">
      <div class="form-grid">
        <div class="field"><label>ID (login)</label><input type="text" id="f-id" placeholder="ex: joao"></div>
        <div class="field"><label>Nome Completo</label><input type="text" id="f-nome" placeholder="ex: João Silva"></div>
        <div class="field"><label>Tipo</label>
          <select id="f-tipo">
            <option value="funcionario">Funcionário</option>
            <option value="motoqueiro">Motoqueiro</option>
          </select>
        </div>
        <div class="field"><label>Senha</label><input type="text" id="f-senha" placeholder="ex: joao123"></div>
        <div class="field"><label>Data Admissão</label><input type="text" id="f-admissao" placeholder="dd/mm/aaaa"></div>
        <div class="field full"><label>Observação</label><input type="text" id="f-obs" placeholder="Opcional"></div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn-sm primary" onclick="salvarPessoa()">💾 Salvar</button>
        <button class="btn-sm" onclick="limparFormFunc()">Limpar</button>
      </div>
    </div>

    <div class="form-card">
      <h3>Pessoas Ativas</h3>
      <div id="tabela-funcs"></div>
    </div>
  </div>

  <div class="pane" id="pane-inativos">
    <div class="form-card">
      <h3>Desligados</h3>
      <p style="color:#64748b; font-size:13px; margin-bottom:16px">
        Não aparecem no login. Dados preservados para consulta e uso jurídico.
      </p>
      <div id="tabela-inativos"></div>
    </div>
  </div>

</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h3 id="modal-title">Título</h3>
        <div class="sub" id="modal-sub"></div>
      </div>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

/* ============================================================
   HELPERS
   ============================================================ */
function toast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + tipo;
  setTimeout(() => el.className = 'toast', 3500);
}

function parseNum(v) {
  if (v === '' || v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  return parseFloat(String(v).replace(/\s/g,'').replace(',','.')) || 0;
}

function fmtHoras(h) { return h.toFixed(2).replace('.', ',') + 'h'; }

function getDayOfWeek(dateStr) {
  if (!dateStr || !dateStr.includes('/')) return '';
  try {
    const [d,m,y] = dateStr.split('/');
    const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
    return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][dt.getDay()];
  } catch(e) { return ''; }
}

function dataToNum(dateStr) {
  if (!dateStr) return 0;
  try {
    const [d,m,y] = dateStr.split('/');
    return new Date(parseInt(y), parseInt(m)-1, parseInt(d)).getTime();
  } catch(e) { return 0; }
}

function diffDias(dateStr) {
  if (!dateStr) return 0;
  try {
    const [d,m,y] = dateStr.split('/');
    const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    return Math.floor((hoje - dt) / (1000*3600*24));
  } catch(e) { return 0; }
}

function addMeses(dateStr, meses) {
  try {
    const [d,m,y] = dateStr.split('/');
    const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
    dt.setMonth(dt.getMonth() + meses);
    return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
  } catch(e) { return ''; }
}

/* ============================================================
   API
   ============================================================ */
async function lerAba(nome) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${nome}!A2:Z?key=${API_KEY}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return (await resp.json()).values || [];
}

async function api(action, payload = {}) {
  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload })
    });
    if (!resp.ok) return { ok:false, error: 'HTTP ' + resp.status };
    return await resp.json();
  } catch (e) {
    console.error('Erro na API:', e);
    return { ok:false, error: 'Falha de conexão: ' + e.message };
  }
}

/* ============================================================
   CONSOLIDAR
   ============================================================ */
function consolidar(nome) {
  const nomeL = nome.toLowerCase();
  const ctrl = controle.filter(c => c.funcionario.toLowerCase() === nomeL);
  const falt = faltas.filter(f => f.funcionario.toLowerCase() === nomeL);
  const adv  = advertencias.filter(a => a.funcionario.toLowerCase() === nomeL);
  const fer  = feriados.filter(f => f.funcionario.toLowerCase() === nomeL);
  const folg = folgas.filter(f => f.funcionario.toLowerCase() === nomeL);
  const fer2 = ferias.filter(f => f.funcionario.toLowerCase() === nomeL);

  let totalBH = ctrl.reduce((s,c) => s + c.saldoBanco, 0);
  const folgasBanco = folg.filter(f => f.origem === 'banco');
  totalBH -= folgasBanco.length * 8;

  const totalHE = ctrl.reduce((s,c) => s + c.horaExtra, 0);
  const feriadosPendentes = fer.filter(f => f.status === 'pendente').length;

  return {
    ctrl, falt, adv, feriados: fer, folg, fer2,
    totalBH, totalHE,
    faltasJust: falt.filter(f => f.comAtestado).length,
    faltasInjust: falt.filter(f => !f.comAtestado).length,
    advertenciasCount: adv.length,
    feriadosPendentes,
    folgasBancoCount: folgasBanco.length
  };
}

/* ============================================================
   LÓGICA DE FÉRIAS
   ============================================================ */
function calcularStatusFerias(f, dados) {
  if (!f.data_admissao) {
    return { tipo: 'neutral', icon: 'ℹ️', msg: 'Data de admissão não cadastrada' };
  }

  const nomeL = f.nome.toLowerCase();
  const feriasPessoa = dados.fer2.filter(x => x.funcionario.toLowerCase() === nomeL);
  const feriasValidas = feriasPessoa.filter(x => x.status === 'agendada' || x.status === 'gozada');

  const ultima = feriasValidas
    .slice()
    .sort((a,b) => dataToNum(b.retorno) - dataToNum(a.retorno))[0];

  if (!ultima) {
    const admissao = f.data_admissao;
    const diasAdmissao = diffDias(admissao);
    const diasParaUmAno = 365 - diasAdmissao;

    if (diasAdmissao < 365) {
      return {
        tipo: 'neutral', icon: '📅',
        msg: `Faltam <b>${diasParaUmAno} dias</b> para completar 1 ano`
      };
    }

    const limite = addMeses(admissao, 20);
    const diasParaLimite = diffDias(limite) * -1;

    if (diasParaLimite > 90) {
      return {
        tipo: 'ok', icon: '✅',
        msg: `Direito a férias desde ${addMeses(admissao, 12)} · Agendar até <b>${limite}</b>`
      };
    } else if (diasParaLimite > 0) {
      return {
        tipo: 'warning', icon: '⚠️',
        msg: `Atenção: agendar férias até <b>${limite}</b> (${diasParaLimite} dias)`
      };
    } else {
      const diasAtraso = Math.abs(diasParaLimite);
      return {
        tipo: 'danger', icon: '🔴',
        msg: `ATRASO de <b>${diasAtraso} dias</b> — agende urgentemente`
      };
    }
  }

  const ultimoRetorno = ultima.retorno;
  const limite = addMeses(ultimoRetorno, 10);
  const diasParaLimite = diffDias(limite) * -1;
  const diasDesdeRetorno = diffDias(ultimoRetorno);

  if (diasDesdeRetorno < 30) {
    return {
      tipo: 'ok', icon: '✅',
      msg: `Férias recentes (retornou em ${ultimoRetorno})`
    };
  }

  if (diasParaLimite > 60) {
    return {
      tipo: 'ok', icon: '📅',
      msg: `Agendar próxima até <b>${limite}</b>`
    };
  } else if (diasParaLimite > 0) {
    return {
      tipo: 'warning', icon: '⚠️',
      msg: `Agendar até <b>${limite}</b> (${diasParaLimite} dias)`
    };
  } else {
    const diasAtraso = Math.abs(diasParaLimite);
    return {
      tipo: 'danger', icon: '🔴',
      msg: `ATRASO de <b>${diasAtraso} dias</b> — agende urgentemente`
    };
  }
}

    originalControle: null,

}

/* ============================================================
   LANÇAMENTO — ETAPA 1
   ============================================================ */
function abrirLancamento(empId) {
  const f = cadastro.find(c => c.id === empId);
  if (!f) return;

  modalState.empId = empId;
  modalState.empNome = f.nome;

  const now = new Date();
  const mesAtual = now.getMonth() + 1;
  const anoAtual = now.getFullYear();
  const mesPadrao = mesAtual === 1 ? 12 : mesAtual - 1;
  const anoPadrao = mesAtual === 1 ? anoAtual - 1 : anoAtual;

  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mesesCompletos = meses.map((m, i) => `${m} - ${String(i+1).padStart(2,'0')}`);
  const anos = [];
  for (let y = anoAtual - 3; y <= anoAtual + 1; y++) anos.push(y);

  const html = `
    <div class="mes-escolha">
      <p>Escolha o <b>mês/ano</b> para lançar:</p>
      <div class="mes-escolha-grid">
        <select id="escolha-mes">
          ${mesesCompletos.map((m, i) => `<option value="${String(i+1).padStart(2,'0')}" ${(i+1) === mesPadrao ? 'selected' : ''}>${m}</option>`).join('')}
        </select>
        <select id="escolha-ano">
          ${anos.map(y => `<option value="${y}" ${y === anoPadrao ? 'selected' : ''}>${y}</option>`).join('')}
        </select>
      </div>
      <button class="btn-sm primary" onclick="carregarMesEProximo()" style="padding:12px 32px; font-size:14px;">Continuar →</button>
    </div>
  `;

  abrirModal('Lançar — ' + f.nome, 'Etapa 1 de 2 · Escolher mês', html);
}

/* ============================================================
   LANÇAMENTO — ETAPA 2
   ============================================================ */
async function carregarMesEProximo() {
  const mes = document.getElementById('escolha-mes').value;
  const ano = document.getElementById('escolha-ano').value;
  const mesAno = `${mes}/${ano}`;

  modalState.mes = mes;
  modalState.ano = ano;

  document.getElementById('modal-body').innerHTML = '<div class="loading show"><span class="spinner"></span> Carregando dados de ' + mesAno + '...</div>';

  await Promise.all([
    carregarCadastro(),
    carregarControle(),
    carregarFaltas(),
    carregarAdvertencias(),
    carregarFeriados(),
    carregarFolgas()
  ]);

  const emp = cadastro.find(c => c.id === modalState.empId);
  if (!emp) { toast('Funcionário não encontrado', 'err'); fecharModal(); return; }

  const nomeL = emp.nome.toLowerCase();

  const ctrlMes = controle.find(c =>
    c.funcionario.toLowerCase() === nomeL && c.mesAno === mesAno
  );
  modalState.originalControle = ctrlMes || null;
  modalState.controle = {
    saldoBanco: ctrlMes ? String(ctrlMes.saldoBanco).replace('.', ',') : '',
    horaExtra: ctrlMes ? String(ctrlMes.horaExtra).replace('.', ',') : '',
    observacao: ctrlMes ? ctrlMes.observacao : ''
  };

  const faltasMes = faltas.filter(f =>
    f.funcionario.toLowerCase() === nomeL && f.data.endsWith(mes + '/' + ano)
  );
  modalState.originalFaltas = faltasMes;
  modalState.faltas = faltasMes.map(f => ({
    data: f.data,
    comAtestado: f.comAtestado,
    observacao: f.observacao,
    _row: f._row,
    _original: true
  }));

  const advMes = advertencias.filter(a =>
    a.funcionario.toLowerCase() === nomeL && a.data.endsWith(mes + '/' + ano)
  );
  modalState.originalAdvertencias = advMes;
  modalState.advertencias = advMes.map(a => ({
    data: a.data,
    motivo: a.motivo,
    _row: a._row,
    _original: true
  }));

  const ferMes = feriados.filter(f =>
    f.funcionario.toLowerCase() === nomeL && f.data.endsWith(mes + '/' + ano)
  );
  modalState.originalFeriados = ferMes;
  modalState.feriados = ferMes.map(f => ({
    data: f.data,
    status: f.status,
    _row: f._row,
    _original: true
  }));

  const folMes = folgas.filter(f =>
    f.funcionario.toLowerCase() === nomeL && f.data.endsWith(mes + '/' + ano)
  );
  modalState.originalFolgas = folMes;
  modalState.folgas = folMes.map(f => ({
    data: f.data,
    origem: f.origem,
    feriadoVinculado: f.feriadoVinculado || null,
    _row: f._row,
    _original: true
  }));

  // Feriados pendentes do funcionário (qualquer mês)
  modalState.feriadosPendentes = feriados
    .filter(f =>
      f.funcionario.toLowerCase() === nomeL &&
      f.status === 'pendente'
    )
    .sort((a,b) => dataToNum(a.data) - dataToNum(b.data));

  renderModalLancamento();
}

/* ============================================================
   LINHAS DO MODAL
   ============================================================ */
function renderLinhaFalta(f, i) {
  return `
    <div class="row-item">
      <input type="text" value="${f.data}" placeholder="Data da falta dd/mm/aaaa" oninput="modalState.faltas[${i}].data = this.value">
      <select onchange="modalState.faltas[${i}].comAtestado = (this.value === '1')">
        <option value="" ${!f.comAtestado ? 'selected' : ''}>❌ Não (sem atestado)</option>
        <option value="1" ${f.comAtestado ? 'selected' : ''}>✅ Sim (com atestado)</option>
      </select>
      <input type="text" value="${f.observacao || ''}" placeholder="Observação (opcional)" oninput="modalState.faltas[${i}].observacao = this.value">
      <button class="row-del" onclick="removerFalta(${i})" title="Remover">🗑</button>
    </div>
  `;
}

function renderLinhaAdvertencia(a, i) {
  return `
    <div class="row-item adv">
      <input type="text" value="${a.data}" placeholder="dd/mm/aaaa" oninput="modalState.advertencias[${i}].data = this.value">
      <input type="text" value="${a.motivo || ''}" placeholder="Motivo da advertência" oninput="modalState.advertencias[${i}].motivo = this.value">
      <button class="row-del" onclick="removerAdvertencia(${i})" title="Remover">🗑</button>
    </div>
  `;
}

function renderLinhaFeriado(f, i) {
  return `
    <div class="row-item fer">
      <input type="text" value="${f.data}" placeholder="Data do feriado trabalhado dd/mm/aaaa" oninput="modalState.feriados[${i}].data = this.value">
      <div style="font-size:12px; color:#64748b; padding:8px 12px; background:#f8fafc; border-radius:6px; text-align:center; border:1px solid #e2e8f0;">
        ℹ️ Status gerenciado automaticamente
      </div>
      <button class="row-del" onclick="removerFeriado(${i})" title="Remover">🗑</button>
    </div>
  `;
}

function renderLinhaFolga(f, i) {
  const temFeriadosPendentes = modalState.feriadosPendentes.length > 0;

  // Aplica a regra de padrão
  let origem = f.origem;
  if (!origem) {
    origem = temFeriadosPendentes ? 'feriado' : 'banco';
    modalState.folgas[i].origem = origem;
  }
  if (origem === 'feriado' && !temFeriadosPendentes) {
    origem = 'banco';
    modalState.folgas[i].origem = 'banco';
  }

  // Define o feriado selecionado
  let feriadoSelecionado = f.feriadoVinculado;

  if (origem === 'feriado' && !feriadoSelecionado && temFeriadosPendentes) {
    feriadoSelecionado = modalState.feriadosPendentes[0]._row;
    modalState.folgas[i].feriadoVinculado = feriadoSelecionado;
  }

  const opcoesFeriados = modalState.feriadosPendentes.map(fer => `
    <option value="${fer._row}" ${feriadoSelecionado == fer._row ? 'selected' : ''}>
      ${fer.data} (${getDayOfWeek(fer.data)})
    </option>
  `).join('');

  const mostrarFeriado = origem === 'feriado' && temFeriadosPendentes;

  return `
    <div class="row-item fol ${mostrarFeriado ? '' : 'sem-feriado'}">
      <input type="text" value="${f.data}" placeholder="Data folga dd/mm/aaaa" oninput="modalState.folgas[${i}].data = this.value">
      <select onchange="trocarOrigemFolga(${i}, this.value)">
        <option value="feriado" ${origem === 'feriado' ? 'selected' : ''} ${!temFeriadosPendentes ? 'disabled' : ''}>
          🏖️ Pagar Feriado ${!temFeriadosPendentes ? '(sem pendentes)' : `(${modalState.feriadosPendentes.length})`}
        </option>
        <option value="banco" ${origem === 'banco' ? 'selected' : ''}>📊 Debitar do Banco</option>
      </select>
      ${mostrarFeriado
        ? `<select onchange="modalState.folgas[${i}].feriadoVinculado = parseInt(this.value)">
            <option value="">-- Selecione o feriado --</option>
            ${opcoesFeriados}
          </select>`
        : `<div style="font-size:11px; color:#94a3b8; text-align:center; padding:8px;">—</div>`
      }
      <button class="row-del" onclick="removerFolga(${i})" title="Remover">🗑</button>
    </div>
  `;
}

window.trocarOrigemFolga = function(i, novaOrigem) {
  modalState.folgas[i].origem = novaOrigem;
  if (novaOrigem === 'banco') {
    modalState.folgas[i].feriadoVinculado = null;
  } else if (novaOrigem === 'feriado') {
    if (!modalState.folgas[i].feriadoVinculado && modalState.feriadosPendentes.length > 0) {
      modalState.folgas[i].feriadoVinculado = modalState.feriadosPendentes[0]._row;
    }
  }
  renderModalLancamento();
};

/* ============================================================
   ADICIONAR / REMOVER LINHAS
   ============================================================ */
function adicionarFalta() {
  modalState.faltas.push({ data: '', comAtestado: false, observacao: '', _original: false });
  renderModalLancamento();
}

function adicionarAdvertencia() {
  modalState.advertencias.push({ data: '', motivo: '', _original: false });
  renderModalLancamento();
}

function adicionarFeriado() {
  // Status sempre 'pendente' — gerenciado pelo sistema
  modalState.feriados.push({ data: '', status: 'pendente', _original: false });
  renderModalLancamento();
}

function adicionarFolga() {
  const temFeriadosPendentes = modalState.feriadosPendentes.length > 0;
  modalState.folgas.push({
    data: '',
    origem: temFeriadosPendentes ? 'feriado' : 'banco',
    feriadoVinculado: temFeriadosPendentes ? modalState.feriadosPendentes[0]._row : null,
    _original: false

function removerFalta(i) {
  if (!confirm('Remover esta falta?')) return;
  modalState.faltas.splice(i, 1);
  renderModalLancamento();
}

function removerAdvertencia(i) {
  if (!confirm('Remover esta advertência?')) return;
  modalState.advertencias.splice(i, 1);
  renderModalLancamento();
}

function removerFeriado(i) {
  if (!confirm('Remover este feriado?')) return;
  modalState.feriados.splice(i, 1);
  renderModalLancamento();
}

function removerFolga(i) {
  if (!confirm('Remover esta folga?')) return;
  modalState.folgas.splice(i, 1);
  renderModalLancamento();
}

/* ============================================================
   SALVAR TUDO
   ============================================================ */
async function salvarTudo() {
  const btn = document.getElementById('btn-salvar-tudo');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  const emp = cadastro.find(c => c.id === modalState.empId);
  const mesAno = modalState.mes + '/' + modalState.ano;

  let erros = [];
  let sucesso = { controle: 0, faltas: 0, advertencias: 0, feriados: 0, folgas: 0, apagados: 0 };

  try {
    // ---------- CONTROLE ----------
    const origC = modalState.originalControle;
    const novoBH = modalState.controle.saldoBanco.trim();
    const novoHE = modalState.controle.horaExtra.trim();
    const novoObs = modalState.controle.observacao.trim();

    const mudouControle = (
      !origC && (novoBH || novoHE || novoObs)
    ) || (
      origC && (
        String(origC.saldoBanco).replace('.', ',') !== novoBH.replace('.', ',') ||
        String(origC.horaExtra).replace('.', ',') !== novoHE.replace('.', ',') ||
        origC.observacao !== novoObs
      )
    );

    if (mudouControle) {
      if (origC) {
        const r = await api('deleteControle', { rowIndex: origC._row });
        if (r.ok) sucesso.apagados++;
        else erros.push('Apagar Controle: ' + r.error);
      }
      if (novoBH || novoHE || novoObs) {
        const r = await api('addControle', {
          funcionario: emp.nome,
          mesAno: mesAno,
          saldoBanco: novoBH,
          horaExtra: novoHE,
          observacao: novoObs,
          lancadoPor: sessNome || 'admin'
        });
        if (r.ok) sucesso.controle++;
        else erros.push('Controle: ' + r.error);
      }
    }

    // ---------- FALTAS ----------
    for (const orig of modalState.originalFaltas) {
      const r = await api('deleteFalta', { rowIndex: orig._row });
      if (r.ok) sucesso.apagados++;
      else erros.push('Apagar Falta: ' + r.error);
    }
    for (const f of modalState.faltas) {
      if (!f.data || !f.data.trim()) continue;
      const r = await api('addFalta', {
        funcionario: emp.nome,
        data: f.data,
        comAtestado: f.comAtestado,
        observacao: f.observacao
      });
      if (r.ok) sucesso.faltas++;
      else erros.push('Falta: ' + r.error);
    }

    // ---------- ADVERTÊNCIAS ----------
    for (const orig of modalState.originalAdvertencias) {
      const r = await api('deleteAdvertencia', { rowIndex: orig._row });
      if (r.ok) sucesso.apagados++;
      else erros.push('Apagar Advertência: ' + r.error);
    }
    for (const a of modalState.advertencias) {
      if (!a.data || !a.data.trim() || !a.motivo || !a.motivo.trim()) continue;
      const r = await api('addAdvertencia', {
        funcionario: emp.nome,
        data: a.data,
        motivo: a.motivo
      });
      if (r.ok) sucesso.advertencias++;
      else erros.push('Advertência: ' + r.error);
    }

    // ---------- FERIADOS ----------
    for (const orig of modalState.originalFeriados) {
      const r = await api('deleteFeriado', { rowIndex: orig._row });
      if (r.ok) sucesso.apagados++;
      else erros.push('Apagar Feriado: ' + r.error);
    }
    for (const f of modalState.feriados) {
      if (!f.data || !f.data.trim()) continue;
      const r = await api('addFeriado', {
        funcionario: emp.nome,
        data: f.data
      });
      if (r.ok) sucesso.feriados++;
      else erros.push('Feriado: ' + r.error);
    }

    // ---------- FOLGAS ----------
    for (const orig of modalState.originalFolgas) {
      const r = await api('deleteFolga', { rowIndex: orig._row });
      if (r.ok) sucesso.apagados++;
      else erros.push('Apagar Folga: ' + r.error);
    }
    for (const f of modalState.folgas) {
      if (!f.data || !f.data.trim()) continue;

      const payload = {
        funcionario: emp.nome,
        data: f.data,
        origem: f.origem
      };

      if (f.origem === 'feriado') {
        if (!f.feriadoVinculado) {
          erros.push('Folga de ' + f.data + ': nenhum feriado selecionado');
          continue;
        }
        payload.feriadoRow = f.feriadoVinculado;
      }

      const r = await api('addFolga', payload);
      if (r.ok) sucesso.folgas++;
      else erros.push('Folga: ' + r.error);
    }

    const total = sucesso.controle + sucesso.faltas + sucesso.advertencias + sucesso.feriados + sucesso.folgas;

    if (erros.length) {
      toast('⚠️ ' + total + ' salvo(s) com ' + erros.length + ' erro(s)', 'err');
      console.error('Erros:', erros);
    } else {
      toast('✅ ' + total + ' lançamento(s) salvos!', 'ok');
    }

    await recarregar();
    fecharModal();

  } catch (e) {
    console.error(e);
    toast('Erro: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '💾 Salvar Tudo';
  }
}

              <td><b>${x.data}</b> <small style="color:#94a3b8">(${getDayOfWeek(x.data)})</small></td>

              <td><small>${detalhe}</small></td>
              <td><button class="btn-sm danger" onclick="apagar('deleteFolga',${x._row})">🗑️</button></td>
            </tr>
          `;
        }).join('')}
      </tbody></table>
      <div style="margin-top:14px; padding:12px 14px; background:#f8fafc; border-radius:8px; font-size:12px; color:#475569">
        💡 Ao apagar uma folga vinculada a feriado, o feriado volta para <b>pendente</b>.
      </div>`
    : '<div class="empty"><span class="empty-icon">📭</span>Nenhuma folga.</div>';
  abrirModal('Folgas — ' + f.nome, '', html);
}

function verFerias(empId) {
  const f = cadastro.find(c => c.id === empId);
  const d = consolidar(f.nome);
  const html = d.fer2.length
    ? `<div style="margin-bottom:16px;">
        <button class="btn-sm primary" onclick="abrirFormFerias('${f.nome}')">＋ Adicionar férias</button>
      </div>
      <table><thead><tr><th>Início</th><th>Fim</th><th>Retorno</th><th>Dias</th><th>Status</th><th></th></tr></thead><tbody>
        ${d.fer2.slice().sort((a,b) => dataToNum(b.inicio) - dataToNum(a.inicio)).map(x => `
          <tr>
            <td><b>${x.inicio}</b></td>
            <td>${x.fim}</td>
            <td>${x.retorno}</td>
            <td>${x.dias}</td>
            <td>${x.status}</td>
            <td><button class="btn-sm danger" onclick="apagar('deleteFerias',${x._row})">🗑️</button></td>
          </tr>
        `).join('')}
      </tbody></table>`
    : `<div style="margin-bottom:16px;">
        <button class="btn-sm primary" onclick="abrirFormFerias('${f.nome}')">＋ Adicionar férias</button>
      </div>
      <div class="empty"><span class="empty-icon">📭</span>Nenhum período de férias.</div>`;
  abrirModal('Férias — ' + f.nome, '', html);
}

function abrirFormFerias(nome) {
  const html = `
    <div class="form-grid">
      <div class="field"><label>Data Início</label><input type="text" id="feri-inicio" placeholder="dd/mm/aaaa"></div>
      <div class="field"><label>Dias</label><input type="text" id="feri-dias" placeholder="ex: 30"></div>
      <div class="field"><label>Status</label>
        <select id="feri-status">
          <option value="agendada">Agendada</option>
          <option value="gozada">Gozada</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>
    </div>
    <div style="background:#f8fafc; padding:14px 16px; border-radius:10px; font-size:12px; color:#475569; margin-bottom:16px">
      ℹ️ Fim e Retorno são calculados automaticamente (retorno pula domingo).
    </div>
    <button class="btn-sm primary" onclick="salvarFerias('${nome}')">💾 Salvar Férias</button>
  `;
  abrirModal('Adicionar Férias — ' + nome, '', html);
}

async function salvarFerias(nome) {
  const p = {
    funcionario: nome,
    inicio: document.getElementById('feri-inicio').value.trim(),
    dias: document.getElementById('feri-dias').value.trim(),
    status: document.getElementById('feri-status').value
  };
  if (!p.inicio || !p.dias) return toast('Preencha início e dias', 'err');
  const r = await api('addFerias', p);
  if (r.ok) { toast('Férias salvas!'); await recarregar(); await verFerias(cadastro.find(c => c.nome === nome)?.id); }
  else toast(r.error || 'Erro', 'err');
}

async function apagar(action, rowIndex) {
  if (!confirm('Apagar esta linha? Esta ação não pode ser desfeita.')) return;
  const r = await api(action, { rowIndex });
  if (r.ok) { toast('Apagado'); await recarregar(); fecharModal(); }
  else toast(r.error || 'Erro', 'err');
}

/* ============================================================
   GERENCIAR PESSOAS
   ============================================================ */
function limparFormFunc() {
  ['f-id','f-nome','f-senha','f-admissao','f-obs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-tipo').value = 'funcionario';
  document.getElementById('func-editing-id').value = '';
  document.getElementById('form-func-title').textContent = 'Nova Pessoa';
  document.getElementById('f-id').disabled = false;
}

function editarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!f) return;
  document.getElementById('f-id').value = f.id;
  document.getElementById('f-id').disabled = true;
  document.getElementById('f-nome').value = f.nome;
  document.getElementById('f-tipo').value = f.tipo;
  document.getElementById('f-senha').value = f.senha;
  document.getElementById('f-admissao').value = f.data_admissao;
  document.getElementById('f-obs').value = f.observacao;
  document.getElementById('func-editing-id').value = f.id;
  document.getElementById('form-func-title').textContent = 'Editando: ' + f.nome;
  document.querySelector('.tab[data-pane="funcs"]').click();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function salvarPessoa() {
  const editId = document.getElementById('func-editing-id').value;
  const id     = document.getElementById('f-id').value.trim().toLowerCase();
  const nome   = document.getElementById('f-nome').value.trim();
  const tipo   = document.getElementById('f-tipo').value;
  const senha  = document.getElementById('f-senha').value.trim();
  const adm    = document.getElementById('f-admissao').value.trim();
  const obs    = document.getElementById('f-obs').value.trim();
  if (!id || !nome || !senha) return toast('Preencha ID, Nome e Senha', 'err');

  let r;
  if (editId) r = await api('updateCadastro', { id: editId, nome, tipo, senha, data_admissao: adm, observacao: obs });
  else r = await api('addCadastro', { id, nome, tipo, senha, data_admissao: adm, observacao: obs });

  if (r.ok) { toast('Salvo!'); limparFormFunc(); await recarregar(); }
  else toast(r.error || 'Erro', 'err');
}

async function inativarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!confirm(`Desativar "${f.nome}"?`)) return;
  const r = await api('setStatusCadastro', { id, status: 'inativo' });
  if (r.ok) { toast('Inativado'); await recarregar(); }
  else toast(r.error || 'Erro', 'err');
}

async function reativarFunc(id) {
  const f = cadastro.find(c => c.id === id);
  if (!confirm(`Reativar "${f.nome}"?`)) return;
  const r = await api('setStatusCadastro', { id, status: 'ativo' });
  if (r.ok) { toast('Reativado'); await recarregar(); }
  else toast(r.error || 'Erro', 'err');
}

/* ============================================================
   LOGOUT / RECARREGAR
   ============================================================ */
function logout() { sessionStorage.clear(); location.href = 'index.html'; }

async function recarregar() {
  document.getElementById('load-banco').classList.add('show');
  try {
    await Promise.all([
      carregarCadastro(), carregarControle(), carregarFaltas(),
      carregarAdvertencias(), carregarFeriados(), carregarFolgas(), carregarFerias()
    ]);
    renderBanco(); renderFuncs(); renderInativos();
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
  finally { document.getElementById('load-banco').classList.remove('show'); }
}

recarregar();
</script>
